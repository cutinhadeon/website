  {type:"mc",q:"Which is the more elegant written form?",options:["Er tut so, als ob er alles weiß.","Er tut so, als wüsste er alles.","Er tut so, als ob er alles wissen würde.","Er tut so, wie er alles weiß."],a:1,ex:"Bare als with the verb immediately after, in Konjunktiv II."},

/* ============================== SETUP ============================== */
UNITS_A.forEach(u => u.level = "A1");
const UNITS = [].concat(UNITS_A, UNITS_B, UNITS_C, UNITS_D, UNITS_E);
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const LEVEL_NAME = {A1:"Absolute beginner",A2:"Elementary",B1:"Independent",B2:"Upper intermediate",C1:"Advanced",C2:"Mastery"};
const GCOUNT = Math.floor(UNITS.length / 5);
const GAUNTLET_TITLES = ["Survival German","Everyday German","Intermediate command","The B1 wall","Formal German","Register and nuance","Advanced precision","Mastery"];

const KEY = "getdeutsched.progress.v1";
let state = { unlocked:1, gaunt:{}, prog:{}, view:{type:"unit", id:1}, stage:"lesson" };
let dbRef = null;

function blank(){ return { lesson:false, practice:false, best:0, passed:false, talked:false, pron:0 }; }
function P(id){ if(!state.prog[id]) state.prog[id] = blank(); return state.prog[id]; }
function G(g){ if(!state.gaunt[g]) state.gaunt[g] = {passed:false, best:0}; return state.gaunt[g]; }
function unitById(id){ return UNITS.find(u => u.id === id); }

function loadLocal(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw);
    if(o && typeof o === "object"){ state.unlocked = o.unlocked || 1; state.prog = o.prog || {}; state.gaunt = o.gaunt || {}; } } }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify({unlocked:state.unlocked, prog:state.prog, gaunt:state.gaunt})); }catch(e){} }
function save(){ saveLocal(); if(dbRef){ try{ dbRef.set({unlocked:state.unlocked, prog:state.prog, gaunt:state.gaunt, at:Date.now()}); }catch(e){} } }
async function initCloud(){
  try{
    if(!window.claude || !claude.use) return;
    const db = await claude.use("db"); const user = await claude.use("user");
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    dbRef = db.doc("data/users/" + id + "/getdeutsched");
    const snap = await dbRef.get();
    const d = snap ? (typeof snap.data === "function" ? snap.data() : snap.data) : null;
    if(d && d.unlocked && d.unlocked > state.unlocked){
      state.unlocked = d.unlocked;
      state.prog = Object.assign({}, d.prog || {}, state.prog);
      state.gaunt = Object.assign({}, d.gaunt || {}, state.gaunt);
      saveLocal(); renderSidebar(); render();
    }
  }catch(e){ dbRef = null; }
}

/* ============================== HELPERS ============================== */
const $ = s => document.querySelector(s);
function el(t,c,h){ const n=document.createElement(t); if(c) n.className=c; if(h!==undefined) n.innerHTML=h; return n; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function norm(s){
  return String(s).toLowerCase().trim().replace(/[.,!?;:"'„“»«]+/g," ").replace(/\s+/g," ").trim()
    .replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue");
}
function matches(input, answers){ const n = norm(input); return answers.some(a => norm(a) === n); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); }
    const t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
function sim(a,b){ a=norm(a); b=norm(b); if(!a&&!b) return 1; const d=lev(a,b); return Math.max(0, 1 - d/Math.max(a.length,b.length)); }

/* --- speech out --- */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || []; }catch(e){ voices=[]; } }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="de-DE"; u.rate = rate || 0.92;
    const v = voices.find(v => v.lang && v.lang.toLowerCase().indexOf("de")===0);
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakerBtn(text){ const b=el("button","spk","🔊"); b.title="Listen"; b.onclick=()=>speak(text); return b; }
function germanOnly(t){ return t.split("\n").filter(l => !/^\s*[\[(]/.test(l)).join(" ").replace(/\[[^\]]*\]/g,"").replace(/\([^)]*\)/g,""); }

/* --- sampling --- */
let sampleFn = undefined;
async function getSample(){
  if(sampleFn !== undefined) return sampleFn;
  try{ sampleFn = (window.claude && claude.use) ? await claude.use("sample") : null; }catch(e){ sampleFn = null; }
  return sampleFn;
}
async function runSample(node, prompt, tier){
  node.textContent = "Thinking…";
  try{
    const s = await getSample();
    if(!s){ node.textContent = "The AI tutor is not available in this view. Everything else in the course still works."; return null; }
    const r = await s(prompt, {modelTier: tier || "default", onText: ({text}) => { node.textContent = text; }});
    return r && r.text;
  }catch(e){
    if(e && e.code === "not_granted") node.textContent = "AI access was declined for this page, so the tutor is off. The lessons, drills and exams all still work.";
    else node.textContent = (e && e.text) ? e.text : "Could not reach the tutor just now — try again in a moment.";
    return null;
  }
}

/* ============================== SIDEBAR ============================== */
function gaunletUnlocked(g){ return P(g*5).passed; }
function renderSidebar(){
  const list = $("#unitList"); list.innerHTML = "";
  LEVELS.forEach(L => {
    const us = UNITS.filter(u => u.level === L);
    if(!us.length) return;
    const done = us.filter(u => P(u.id).passed).length;
    const h = el("div","lvl",'<span class="cef">'+L+'</span><span>'+LEVEL_NAME[L]+'</span><span class="pc">'+done+'/'+us.length+'</span>');
    list.appendChild(h);
    us.forEach(u => {
      const p = P(u.id), locked = u.id > state.unlocked;
      const b = el("button","unit-btn"+(state.view.type==="unit"&&state.view.id===u.id?" active":"")+(p.passed?" done":""));
      b.disabled = locked;
      b.innerHTML = '<span class="num">'+(p.passed?"✓":(locked?"🔒":u.id))+'</span><span><span class="t">'+esc(u.title)+'</span><br><span class="s">'+esc(u.sub)+'</span></span>';
      b.onclick = () => go({type:"unit", id:u.id});
      list.appendChild(b);
      if(u.id % 5 === 0){
        const g = u.id/5, gs = G(g), open = gaunletUnlocked(g);
        const gb = el("button","unit-btn gaunt"+(state.view.type==="gauntlet"&&state.view.id===g?" active":""));
        gb.disabled = !open;
        gb.innerHTML = '<span class="num">'+(gs.passed?"★":(open?"⚔":"🔒"))+'</span><span><span class="t">Gauntlet '+g+': '+esc(GAUNTLET_TITLES[g-1]||"")+'</span><br><span class="s">Hard mode · units '+(u.id-4)+'–'+u.id+'</span></span>';
        gb.onclick = () => go({type:"gauntlet", id:g});
        list.appendChild(gb);
      }
    });
  });
  const done = UNITS.filter(u => P(u.id).passed).length;
  const gdone = Object.keys(state.gaunt).filter(k => state.gaunt[k].passed).length;
  const pct = Math.round((done + gdone) / (UNITS.length + GCOUNT) * 100);
  $("#overallTxt").textContent = pct + "% complete · " + done + "/" + UNITS.length + " modules · " + gdone + "/" + GCOUNT + " gauntlets";

        save(); renderSidebar();

        box.appendChild(r);

function quizWidget(cfg){
  const card = el("div","card");
  const items = cfg.items;
  let i = 0, correct = 0, answered = false;
  const wrong = [];
  const meta = el("div","qmeta"), bar = el("div","prog",'<i style="width:0%"></i>'), body = el("div");
  card.appendChild(meta); card.appendChild(bar); card.appendChild(body);

  function head(){
    meta.innerHTML = "";
    meta.appendChild(el("span",null, cfg.title + (cfg.need ? (" · pass " + cfg.need + "/" + items.length) : "")));
    meta.appendChild(el("span",null, "Question " + (i+1) + " of " + items.length + " · " + correct + " correct"));
    bar.querySelector("i").style.width = (i/items.length*100)+"%";
  }
  function rerun(){ const parent = card.parentNode; const fresh = quizWidget(cfg); parent.replaceChild(fresh, card); window.scrollTo({top:0,behavior:"smooth"}); }
  function finish(){
    body.innerHTML=""; meta.innerHTML=""; bar.querySelector("i").style.width="100%";
    const passed = cfg.need ? correct >= cfg.need : true;
    body.appendChild(cfg.onFinish(correct, passed, rerun));
    if(wrong.length){
      const rev = el("div"); rev.style.marginTop="26px";
      rev.appendChild(el("h3",null,"Review — what you missed"));
      wrong.forEach(q => {
        const d = el("div","fb neutral"); d.style.marginTop="10px";
        d.innerHTML = "<b>"+esc(q.q)+"</b>\n"+esc(q.ex);
        rev.appendChild(d);
      });
      body.appendChild(rev);
    }
  }
  function feedback(ok,q){
    answered = true;
    if(!ok) wrong.push(q);
    const r = el("div","row");
    if(cfg.instant === false){
      const n = el("button","btn", i===items.length-1 ? "Finish" : "Next →");
      n.onclick = () => { i++; if(i>=items.length) finish(); else draw(); };
      r.appendChild(n); body.appendChild(r); n.focus(); return;
    }
    const fb = el("div","fb "+(ok?"ok":"no"));
    fb.innerHTML = "<b>"+(ok?"Richtig!":"Nicht ganz.")+"</b> "+esc(q.ex);
    body.appendChild(fb);
    const n = el("button","btn", i===items.length-1 ? "See results" : "Next question →");
    n.onclick = () => { i++; if(i>=items.length) finish(); else draw(); };
    r.appendChild(n);
    const why = el("button","btn sec","✦ Ask the tutor why");
    why.onclick = () => {
      const out = el("div","fb neutral"); body.appendChild(out); why.disabled = true;
      runSample(out, "You are a German teacher helping an English-speaking learner at level "+(cfg.context?cfg.context.level:"B1")+".\nExercise: "+q.q+"\n"+(q.sub?("Context: "+q.sub+"\n"):"")+"Teaching point: "+q.ex+"\nExplain the underlying rule in clear English in under 130 words, then give two extra German examples with translations. Plain text.", "quick").then(()=>{ why.disabled=false; });
    };
    r.appendChild(why);
    body.appendChild(r); n.focus();
  }
  function draw(){
    answered = false; head(); body.innerHTML = "";
    const q = items[i];
    if(q.type === "listen"){
      const play = el("button","btn sec","🔊 Play the German"); play.onclick = () => speak(q.say);
      body.appendChild(play); speak(q.say);
    }
    body.appendChild(el("div","qtext", esc(q.q)));
    if(q.sub) body.appendChild(el("div","qsub", esc(q.sub)));

    if(q.type==="mc" || q.type==="listen"){
      q.options.forEach((opt,idx) => {
        const b = el("button","opt", esc(opt));
        b.onclick = () => {
          if(answered) return;
          const ok = idx === q.a;
          Array.from(body.querySelectorAll(".opt")).forEach((o,j)=>{ o.disabled=true; if(cfg.instant!==false && j===q.a) o.classList.add("right"); });
          if(!ok && cfg.instant!==false) b.classList.add("wrong");
          if(ok) correct++;
          feedback(ok,q);
        };
        body.appendChild(b);
      });
    }
    if(q.type==="fill"){
      const inp = el("input","txt"); inp.placeholder="Type your answer…"; inp.autocapitalize="off"; inp.autocomplete="off"; inp.spellcheck=false;
      body.appendChild(inp);
      const um = el("div","umlauts"); ["ä","ö","ü","ß"].forEach(ch => { const b=el("button",null,ch); b.onclick=()=>{ inp.value+=ch; inp.focus(); }; um.appendChild(b); });
      body.appendChild(um);
      const r = el("div","row"), check = el("button","btn","Check");
      check.onclick = () => {
        if(answered) return;
        const ok = matches(inp.value, q.a);
        if(ok) correct++;
        inp.disabled = true; check.disabled = true;
        if(!ok && cfg.instant!==false){ const s=el("div","qsub"); s.innerHTML="Correct answer: <b>"+esc(q.a[0])+"</b>"; body.appendChild(s); }
        feedback(ok,q);
      };
      inp.addEventListener("keydown", e => { if(e.key==="Enter") check.click(); });
      r.appendChild(check); body.appendChild(r); setTimeout(()=>inp.focus(),40);
    }
    if(q.type==="order"){
      const target = el("div","chips"), pool = el("div","chips"), picked = [];
      const words = shuffle(q.words);
      function paint(){
        target.innerHTML=""; pool.innerHTML="";
        picked.forEach((w,idx) => { const c=el("button","chip",esc(w)); c.onclick=()=>{ if(answered) return; picked.splice(idx,1); words.push(w); paint(); }; target.appendChild(c); });
        words.forEach((w,idx) => { const c=el("button","chip",esc(w)); c.onclick=()=>{ if(answered) return; words.splice(idx,1); picked.push(w); paint(); }; pool.appendChild(c); });
      }
      paint();
      body.appendChild(el("div","qsub","Tap the words in order. Tap one above to send it back."));
      body.appendChild(target); body.appendChild(pool);
      const r = el("div","row"), check = el("button","btn","Check");
      check.onclick = () => {
        if(answered) return;
        const ok = norm(picked.join(" ")) === norm(q.a);
        if(ok) correct++;
        check.disabled = true;
        if(cfg.instant !== false){ const s=el("div","qsub"); s.innerHTML="Correct: <b>"+esc(q.a)+".</b>"; body.appendChild(s); speak(q.a); }
        feedback(ok,q);
      };
      r.appendChild(check); body.appendChild(r);
    }
  }
  draw();
  return card;
}

/* ============================== GAUNTLET ============================== */
function gauntletPool(g){
  const from = g*5-4, to = g*5;
  let pool = [];
  for(let id=from; id<=to; id++){
    const u = unitById(id); if(!u) continue;
    pool = pool.concat(u.checkpoint.map(q => Object.assign({}, q, {_u:u})));
    pool = pool.concat(u.practice.filter(q => q.type!=="listen").map(q => Object.assign({}, q, {_u:u})));
  }
  const hard = pool.filter(q => q.type==="fill" || q.type==="order");
  const rest = pool.filter(q => q.type==="mc");
  return shuffle(hard).slice(0,9).concat(shuffle(rest).slice(0,6));
}
function gauntletHead(g){
  const gs = G(g), from = g*5-4, to = g*5;
  const c = el("div","card");
  c.appendChild(el("div","eyebrow","Gauntlet " + g + " · hard mode"));
  const h = el("h1",null,esc(GAUNTLET_TITLES[g-1]||"Exam")); h.style.cssText="font-size:31px;margin-top:6px"; c.appendChild(h);
  c.appendChild(el("div","mini","Modules " + from + "–" + to + " · 15 mixed questions · no feedback until the end · pass mark 12/15" + (gs.passed?" · best "+gs.best+"/15":"")));
  return c;
}
function renderGauntlet(g){
  const gs = G(g);
  if(!gaunletUnlocked(g)){
    const c = el("div","card"); c.appendChild(el("p",null,"Finish module " + (g*5) + " first."));
    return c;
  }
  const items = gauntletPool(g);
  return quizWidget({
    items: items, need: 12, title: "Gauntlet " + g, instant: false, context: unitById(g*5),
    onFinish(correct, passed, rerun){
      const box = el("div","center");
      box.appendChild(el("div","score", correct + " / " + items.length));
      gs.best = Math.max(gs.best, correct);
      if(passed){
        gs.passed = true;
        const nx = unitById(g*5+1);
        if(nx && state.unlocked < nx.id) state.unlocked = nx.id;
        save(); renderSidebar();
        box.appendChild(el("div","badge gold","Gauntlet cleared"));
        box.appendChild(el("h2",null,"Bestanden!"));
        box.appendChild(el("p",null, nx ? ("The next block is open. Module " + nx.id + " — " + nx.title + ".") : "That was the final gauntlet. You have completed getDeutsched to C2."));
        if(nx){ const r=el("div","row"); r.style.justifyContent="center"; const n=el("button","btn","Module "+nx.id+" →"); n.onclick=()=>go({type:"unit",id:nx.id}); r.appendChild(n); box.appendChild(r); }
      } else {
        save(); renderSidebar();
        box.appendChild(el("h2",null,"Not through yet"));
        box.appendChild(el("p",null,"You need 12 of 15. The review below shows exactly which rules to revisit — the questions are redrawn each attempt."));
        const r = el("div","row"); r.style.justifyContent="center";
        const a = el("button","btn gold","Try the gauntlet again"); a.onclick = rerun;
        const b = el("button","btn sec","Revise module " + (g*5-4)); b.onclick = () => go({type:"unit", id:g*5-4});
        r.appendChild(a); r.appendChild(b); box.appendChild(r);
      }
      return box;
    }
  });
}

/* ============================== PRONUNCIATION ============================== */
function unitSentences(u){
  const out = [];
  u.concepts.forEach(c => { if(c.ex) c.ex.forEach(p => { if(p[0] && p[0].length < 90) out.push({de:p[0], en:p[1]}); }); });
  return out.slice(0,10);
}
function levelSentences(L){
  let out = [];
  UNITS.filter(u => u.level === L).forEach(u => { out = out.concat(unitSentences(u)); });
  return shuffle(out).slice(0,12);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function renderPron(sentences, u){
  const card = el("div","card");
  card.appendChild(el("div","eyebrow","Pronunciation"));
  card.appendChild(el("h2",null,"Say it, and see how close you got"));
  card.appendChild(el("p","mini","Listen to the model, then record yourself. Your speech is transcribed by your browser and compared word by word with the target. 90+ is excellent, 75+ is solid."));
  if(!sentences.length){ card.appendChild(el("p",null,"No sentences available here.")); return card; }

  let idx = 0, scores = [];
  const stage = el("div"); card.appendChild(stage);

  function draw(){
    stage.innerHTML = "";
    const s = sentences[idx];
    stage.appendChild(el("div","qmeta",'<span>Sentence '+(idx+1)+' of '+sentences.length+'</span><span>'+(scores.length?("average "+Math.round(scores.reduce((a,b)=>a+b,0)/scores.length)+"%"):"")+'</span>'));
    const t = el("div","pron-target"); t.innerHTML = esc(s.de); stage.appendChild(t);
    stage.appendChild(el("div","mini", esc(s.en)));

    const controls = el("div","row");
    const play = el("button","btn sec","🔊 Model"); play.onclick = () => speak(s.de, 0.92);
    const slow = el("button","btn sec","🐢 Slow"); slow.onclick = () => speak(s.de, 0.55);
    controls.appendChild(play); controls.appendChild(slow);

    const result = el("div");
    if(SR){
      const mic = el("button","btn","🎙 Record and score");
      let rec = null, on = false;
      mic.onclick = () => {
        if(on && rec){ try{ rec.stop(); }catch(e){} return; }
        try{
          rec = new SR(); rec.lang="de-DE"; rec.interimResults=false; rec.maxAlternatives=3;
          rec.onstart = () => { on=true; mic.textContent="● Listening… tap to stop"; mic.classList.add("rec"); };
          rec.onerror = ev => { result.innerHTML=""; result.appendChild(el("div","fb no","Microphone problem ("+(ev.error||"unknown")+"). Check that this page is allowed to use your mic.")); };
          rec.onend = () => { on=false; mic.textContent="🎙 Record and score"; mic.classList.remove("rec"); };
          rec.onresult = ev => {
            let best = "", bestScore = -1;
            for(let k=0;k<ev.results[0].length;k++){
              const alt = ev.results[0][k].transcript;
              const sc = sim(alt, s.de);
              if(sc > bestScore){ bestScore = sc; best = alt; }
            }
            showScore(best, Math.round(bestScore*100));
          };
          rec.start();
        }catch(e){ result.innerHTML=""; result.appendChild(el("div","fb no","Recording is not available in this browser.")); }
      };
      controls.appendChild(mic);
    } else {
      controls.appendChild(el("div","mini","Live scoring needs Chrome, Edge or another browser with speech recognition. You can still shadow the model audio and get coaching below."));
      const coach = el("button","btn","✦ Coach me on this sentence");
      coach.onclick = () => {
        const out = el("div","fb neutral"); result.innerHTML=""; result.appendChild(out); coach.disabled = true;
        runSample(out, "German pronunciation coaching for an English speaker. Sentence: \""+s.de+"\".\nGive: (1) a simple English respelling of the whole sentence, (2) the two or three sounds an English speaker will most likely get wrong here and exactly how to make them, (3) where the sentence stress and the natural pause fall. Under 170 words, plain text.", "quick").then(()=>{ coach.disabled=false; });
      };
      controls.appendChild(coach);
      const self = el("button","btn sec","Mark as practised"); self.onclick = () => { scores.push(80); next(); };
      controls.appendChild(self);
    }
    stage.appendChild(controls);
    stage.appendChild(result);

    function showScore(heard, score){
      scores.push(score);
      result.innerHTML = "";
      const band = score>=90 ? ["Ausgezeichnet","var(--good)"] : score>=75 ? ["Gut","var(--gold)"] : score>=55 ? ["Verständlich","var(--gold)"] : ["Noch üben","var(--bad)"];
      const top = el("div","center");
      const bs = el("div","bigscore", score + "%"); bs.style.color = band[1]; top.appendChild(bs);
      top.appendChild(el("div",null,'<span class="pill" style="border-color:'+band[1]+';color:'+band[1]+'">'+band[0]+'</span>'));
      result.appendChild(top);
      const m = el("div","meter"); const fill = el("i"); fill.style.width = score+"%"; fill.style.background = band[1]; m.appendChild(fill); result.appendChild(m);
      // word by word
      const tw = s.de.split(/\s+/), hw = norm(heard).split(" ");
      const line = el("div"); line.style.margin = "12px 0";
      let cursor = 0;
      tw.forEach(w => {
        let bestI = -1, bestS = 0;
        for(let k=cursor; k<Math.min(hw.length, cursor+3); k++){ const sc = sim(w, hw[k]); if(sc > bestS){ bestS = sc; bestI = k; } }
        if(bestI >= 0) cursor = bestI + 1;
        const cls = bestS > .9 ? "good" : bestS > .6 ? "near" : "bad";
        line.appendChild(el("span","pw "+cls, esc(w)));
      });
      result.appendChild(line);
      result.appendChild(el("div","mini","Heard: " + esc(heard || "—")));
      const r = el("div","row");
      const again = el("button","btn sec","Try again"); again.onclick = () => { scores.pop(); draw(); };
      const coach = el("button","btn sec","✦ Why was it off?");
      coach.onclick = () => {
        const out = el("div","fb neutral"); result.appendChild(out); coach.disabled = true;
        runSample(out, "You are a German pronunciation coach for an English speaker.\nTarget sentence: \""+s.de+"\"\nWhat the speech recogniser heard: \""+heard+"\"\nSimilarity score: "+score+"%.\nDiagnose which sounds or word stresses most likely caused the mismatch (ignore recogniser noise where the words are clearly right). Give concrete mouth-position advice for each problem sound and two short drill words. Under 170 words, plain text, English.", "quick").then(()=>{ coach.disabled=false; });
      };
      const nx = el("button","btn", idx===sentences.length-1 ? "Finish" : "Next sentence →"); nx.onclick = next;
      r.appendChild(nx); r.appendChild(again); r.appendChild(coach);
      result.appendChild(r);
    }
  }
  function next(){
    if(idx === sentences.length-1){
      const avg = Math.round(scores.reduce((a,b)=>a+b,0)/Math.max(1,scores.length));
      if(u){ P(u.id).pron = Math.max(P(u.id).pron||0, avg); save(); renderSidebar(); }
      stage.innerHTML = "";
      const box = el("div","center");
      box.appendChild(el("div","bigscore", avg + "%"));
      box.appendChild(el("h2",null, avg>=90 ? "Excellent pronunciation" : avg>=75 ? "Solid — clearly understandable" : "Keep drilling this set"));
      box.appendChild(el("p","mini","Average across " + scores.length + " sentences."));
      const r = el("div","row"); r.style.justifyContent="center";
      const a = el("button","btn sec","Run the set again"); a.onclick = () => { idx=0; scores=[]; draw(); };
      r.appendChild(a);
      if(u){ const n = el("button","btn","Back to the module"); n.onclick = () => { state.stage="practice"; render(); }; r.appendChild(n); }
      box.appendChild(r);
      stage.appendChild(box);
      return;
    }
    idx++; draw();
  }
  draw();
  return card;
}

function labHead(){
  const c = el("div","card");
  c.appendChild(el("div","eyebrow","Pronunciation lab"));
  const h = el("h1",null,"Free pronunciation practice"); h.style.cssText="font-size:31px;margin-top:6px"; c.appendChild(h);
  c.appendChild(el("div","mini","Pick a level and drill twelve random sentences from it. Nothing here is locked."));
  const row = el("div","row");
  LEVELS.forEach(L => {
    const b = el("button","btn"+(state.view.lvl===L?"":" sec"), L);
    b.onclick = () => { state.view = {type:"lab", lvl:L}; render(); };
    row.appendChild(b);
  });
  c.appendChild(row);
  return c;
}
function renderLab(){
  const L = state.view.lvl || "A1";
  return renderPron(levelSentences(L), null);
}

/* ============================== SPEAKING ============================== */
function renderTalk(u){
  const card = el("div","card");
  card.appendChild(el("div","eyebrow","Sprechen"));
  card.appendChild(el("h2",null,esc(u.talk.title)));
  card.appendChild(el("p",null,esc(u.talk.task)));
  const chat = el("div","chat"); card.appendChild(chat);
  const history = [];
  const brief = "You are a warm, exacting German tutor in conversation with a learner at CEFR level "+u.level+". " +
    "They have just studied: "+u.title+" — "+u.sub+". Goal: "+u.goal+" Task: "+u.talk.task+"\n" +
    "RULES: Write in German at level "+u.level+", never above it. Keep replies under 55 words. " +
    "Add a very short English gloss in square brackets on a new line. " +
    "If the learner makes a mistake, correct it on a line starting with 'Korrektur:' showing the fixed sentence and a five-word reason. " +
    "Always end with one question so the conversation continues. Never switch fully to English unless asked.";

  function bubble(role, text){
    const b = el("div","msg "+(role==="me"?"me":"ai")); b.textContent = text;
    if(role==="ai"){ const s=el("button","spk","🔊"); s.style.cssText="margin-top:6px;display:block"; s.onclick=()=>speak(germanOnly(b.textContent)); b.appendChild(s); }
    chat.appendChild(b); chat.scrollTop = chat.scrollHeight; return b;
  }
  bubble("ai", u.talk.starter);
  history.push({role:"assistant", content:u.talk.starter});

  const comp = el("div","composer");
  const inp = el("input","txt"); inp.placeholder="Antworte auf Deutsch…"; inp.autocomplete="off"; inp.spellcheck=false;
  const send = el("button","btn","Send");
  comp.appendChild(inp); comp.appendChild(send); card.appendChild(comp);
  const um = el("div","umlauts"); ["ä","ö","ü","ß"].forEach(ch => { const b=el("button",null,ch); b.onclick=()=>{ inp.value+=ch; inp.focus(); }; um.appendChild(b); });
  card.appendChild(um);

  if(SR){
    const mic = el("button","btn sec","🎙 Speak your answer"); mic.style.marginTop="10px";
    let rec=null, on=false;
    mic.onclick = () => {
      if(on && rec){ try{ rec.stop(); }catch(e){} return; }
      try{
        rec = new SR(); rec.lang="de-DE"; rec.interimResults=false;
        rec.onstart = () => { on=true; mic.textContent="● Listening… tap to stop"; mic.classList.add("rec"); };
        rec.onresult = ev => { inp.value = ev.results[0][0].transcript; };
        rec.onend = () => { on=false; mic.textContent="🎙 Speak your answer"; mic.classList.remove("rec"); };
        rec.start();
      }catch(e){ mic.disabled = true; }
    };
    card.appendChild(mic);
  }
  const row = el("div","row");
  const done = el("button","btn sec","Mark this conversation as done");
  done.onclick = () => { P(u.id).talked = true; save(); renderSidebar(); render(); };
  row.appendChild(done); card.appendChild(row);

  async function sendNow(){
    const txt = inp.value.trim(); if(!txt) return;
    inp.value=""; bubble("me", txt); history.push({role:"user", content:txt});
    send.disabled = true;
    const out = bubble("ai","Denke nach…");
    try{
      const s = await getSample();
      if(!s){ out.textContent = "The live tutor is unavailable in this view. The rest of the module still works."; send.disabled=false; return; }
      const turns = [{role:"user", content: brief + "\n\nYour opening line was: " + u.talk.starter}].concat(history);
      let acc = "";
      const res = await s(turns, {cache:false, onText: ({text}) => { acc = text; out.textContent = text; chat.scrollTop = chat.scrollHeight; }});
      const final = (res && res.text) || acc;
      out.textContent = final;
      const sp = el("button","spk","🔊"); sp.style.cssText="margin-top:6px;display:block"; sp.onclick=()=>speak(germanOnly(final)); out.appendChild(sp);
      history.push({role:"assistant", content:final});
      speak(germanOnly(final));
    }catch(e){
      out.textContent = (e && e.code==="not_granted") ? "AI access was declined for this page, so the tutor is off." : ((e && e.text) ? e.text : "The tutor could not answer just now.");
    } finally { send.disabled = false; }
  }
  send.onclick = sendNow;
  inp.addEventListener("keydown", e => { if(e.key==="Enter") sendNow(); });
  return card;
}

/* ============================== HIGHLIGHT EXPLAINER ============================== */
const selBtn = $("#selBtn"), drawer = $("#drawer"), drawerBody = $("#drawerBody");
$("#drawerClose").onclick = () => drawer.classList.remove("open");
let lastSel = "";
function hideSel(){ selBtn.style.display = "none"; }
document.addEventListener("selectionchange", () => {
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed){ hideSel(); return; }
  const text = sel.toString().trim();
  if(text.length < 2 || text.length > 600){ hideSel(); return; }
  if(drawer.contains(sel.anchorNode)){ hideSel(); return; }
  lastSel = text;
  try{
    const r = sel.getRangeAt(0).getBoundingClientRect();
    if(!r || (!r.width && !r.height)){ hideSel(); return; }
    selBtn.style.display = "block";
    const top = r.top + window.scrollY - 44;
    selBtn.style.top = Math.max(window.scrollY + 6, top) + "px";
    selBtn.style.left = Math.min(window.innerWidth - 150, Math.max(8, r.left + window.scrollX)) + "px";
  }catch(e){ hideSel(); }
});
selBtn.onmousedown = e => e.preventDefault();
selBtn.onclick = () => {
  const text = lastSel;
  hideSel();
  drawer.classList.add("open");
  drawerBody.innerHTML = "";
  const q = el("div","quote", esc(text)); drawerBody.appendChild(q);
  const spk = el("button","btn sec","🔊 Hear it"); spk.onclick = () => speak(text); drawerBody.appendChild(spk);
  const out = el("div"); out.style.marginTop = "14px"; drawerBody.appendChild(out);
  const u = state.view.type === "unit" ? unitById(state.view.id) : null;
  const ctx = u ? ("The learner is currently studying module " + u.id + " (" + u.level + "): " + u.title + " — " + u.sub + ".") : "";
  runSample(out,
    "You are a German grammar analyst writing for an English-speaking learner. " + ctx + "\n" +
    "Analyse this selected text exactly as it stands:\n\"" + text + "\"\n\n" +
    "Respond in plain text with these sections, no markdown symbols:\n" +
    "TRANSLATION: a natural English translation.\n" +
    "WORD BY WORD: each significant word, its dictionary form, its part of speech, and its case/tense/number where relevant.\n" +
    "WHY THESE FORMS: the reasoning behind every ending, case and article — say which word or preposition forces each one.\n" +
    "WORD ORDER: why each element sits where it does (verb position, bracket, middle field).\n" +
    "WATCH OUT: one mistake a learner would plausibly make here.\n" +
    "If the selected text is English or is not a German phrase, say so briefly and explain what it means for learning German instead. Under 320 words.");
};

/* ============================== BOOT ============================== */
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur === "dark" ? "light" : (cur === "light" ? "dark" : (dark ? "light" : "dark"));
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("getdeutsched.theme", next); }catch(e){}
};
try{ const t = localStorage.getItem("getdeutsched.theme"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
$("#labBtn").onclick = () => go({type:"lab", lvl:"A1"});
$("#resetBtn").onclick = () => {
  if(!confirm("Reset all progress and start again from module 1?")) return;
  state.unlocked = 1; state.prog = {}; state.gaunt = {}; state.view = {type:"unit", id:1}; state.stage = "lesson";
  save(); renderSidebar(); render();
};

loadLocal();
UNITS.forEach(u => P(u.id));
state.view = {type:"unit", id: Math.min(state.unlocked, UNITS.length)};
renderSidebar();
render();
initCloud();

</script>

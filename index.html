 id:18, level:"B1", title:"Konjunktiv II", sub:"Would, could, and polite German",
 goal:"Express hypotheticals, wishes and polite requests the way Germans actually do.",
 concepts:[
  {h:"würde + infinitive is the workhorse",
   body:`<p>For most verbs, the hypothetical is built with <span class="de">würde</span> plus the infinitive at the end. The original Konjunktiv II form of ordinary verbs (<span class="de">ich ginge</span>) survives mainly in literature.</p>`,
   table:[["Person","Form","Example"],["ich","würde","Ich würde gern mitkommen."],["du","würdest","Würdest du mir helfen?"],["er/sie/es","würde","Er würde es machen."],["wir/sie/Sie","würden","Wir würden gern bleiben."],["ihr","würdet","Würdet ihr warten?"]],
   ex:[["Ich würde gern nach Japan reisen.","I would like to travel to Japan."]],
   tip:"<b>Würden Sie bitte …?</b> is the most polite request form in German. Use it with strangers."},
  {h:"The verbs that keep their own form",
   body:`<p>A handful are so common that the real Konjunktiv II survives and <i>würde</i> sounds clumsy with them.</p>`,
   table:[["Verb","Konjunktiv II","Meaning"],["sein","wäre","would be"],["haben","hätte","would have"],["können","könnte","could"],["müssen","müsste","would have to"],["dürfen","dürfte","would be allowed / might"],["sollen","sollte","should"],["mögen","möchte","would like"],["wissen","wüsste","would know"]],
   ex:[["Das wäre schön.","That would be nice."],["Könnten Sie mir helfen?","Could you help me?"],["Ich hätte eine Frage.","I have a question. (politely)"]],
   tip:"Recipe: take the Präteritum (war, hatte, konnte), add an umlaut and -e where needed → wäre, hätte, könnte."},
  {h:"Unreal conditions with wenn",
   body:`<p>Both halves go into Konjunktiv II. The <span class="de">wenn</span> clause sends its verb to the end, and you may drop <span class="de">wenn</span> entirely by starting with the verb.</p>`,
   table:[["Type","Example","Meaning"],["Present unreal","Wenn ich Zeit hätte, würde ich kommen.","If I had time, I would come."],["Without wenn","Hätte ich Zeit, würde ich kommen.","Had I time, I would come."],["Past unreal","Wenn ich Zeit gehabt hätte, wäre ich gekommen.","If I had had time, I would have come."],["Wish","Wenn ich nur mehr Zeit hätte!","If only I had more time!"]],
   ex:[["An deiner Stelle würde ich warten.","In your position I would wait."]],

{
 id:19, level:"B1", title:"Das Passiv", sub:"When the doer does not matter",
 goal:"Form and recognise the passive in present and past, and know when German prefers it.",
 concepts:[
  {h:"werden + Partizip II",
   body:`<p>The passive shifts attention to the action. The original subject either disappears or returns with <span class="de">von</span> (a person) or <span class="de">durch</span> (a means).</p>`,
   table:[["Tense","Structure","Example"],["Präsens","wird/werden + P II","Das Haus wird gebaut."],["Präteritum","wurde/wurden + P II","Das Haus wurde gebaut."],["Perfekt","ist … worden","Das Haus ist gebaut worden."],["with modal","muss … werden","Das Haus muss gebaut werden."]],
   ex:[["Die Rechnung wird morgen bezahlt.","The bill will be paid tomorrow."],["Amerika wurde 1492 entdeckt.","America was discovered in 1492."]],
   tip:"In the Perfekt passive the participle of werden is <b>worden</b>, not <i>geworden</i>."},
  {h:"von or durch",
   body:`<p>If you must name the agent, choose based on what it is.</p>`,
   table:[["Word","Use","Example"],["von + dative","a person or institution","Der Brief wurde von meiner Mutter geschrieben."],["durch + accusative","a cause, means or process","Die Stadt wurde durch ein Erdbeben zerstört."]],
   ex:[["Das Problem wurde durch ein Update gelöst.","The problem was solved by an update."]],
   tip:"Most real passive sentences name no agent at all. That is the whole point of using it."},
  {h:"Passive is everywhere in official German",
   body:`<p>Signs, instructions, reports and academic writing lean on the passive because the actor is irrelevant or obvious.</p>`,
   table:[["German","English"],["Hier wird nicht geraucht.","No smoking here."],["Es wird viel gearbeitet.","There is a lot of work going on."],["Die Tür wird automatisch geöffnet.","The door opens automatically."],["Ihnen kann geholfen werden.","You can be helped."]],
   ex:[["Der Antrag muss bis Freitag eingereicht werden.","The application must be submitted by Friday."]],
   tip:"Impersonal passives with <b>es wird …</b> have no subject at all — a structure English simply cannot copy."}
 ],

 id:20, level:"B1", title:"Relativsätze", sub:"The man who, the book that",
 goal:"Attach a whole clause to a noun with the right relative pronoun.",
 concepts:[
  {h:"The pronoun takes its gender from the noun and its case from its own clause",
   body:`<p>This is the whole rule, and it is worth saying twice. <b>Gender and number</b> come from the noun you are describing. <b>Case</b> comes from the job the pronoun does inside the relative clause. The verb goes to the end.</p>`,
   table:[["Case","masc.","fem.","neut.","plural"],["Nominative","der","die","das","die"],["Accusative","den","die","das","die"],["Dative","dem","der","dem","denen"],["Genitive","dessen","deren","dessen","deren"]],
   ex:[["Der Mann, der dort steht, ist mein Chef.","The man who is standing there is my boss."],["Der Mann, den ich gestern traf, ist mein Chef.","The man whom I met yesterday is my boss."]],
   tip:"Only two forms differ from the definite article: dative plural <b>denen</b>, and the whole genitive row."},
  {h:"With prepositions",
   body:`<p>The preposition comes first and decides the case. German never strands a preposition at the end the way English does.</p>`,
   table:[["German","English"],["Das ist die Frau, mit der ich arbeite.","That is the woman I work with."],["Der Film, über den wir gesprochen haben, läuft noch.","The film we talked about is still showing."],["Die Stadt, in der ich wohne, ist klein.","The city I live in is small."]],
   ex:[["Das Buch, von dem ich erzählt habe, ist toll.","The book I told you about is great."]],
   tip:"Ask yourself which preposition the verb needs (<i>arbeiten mit</i>, <i>sprechen über</i>), then apply its case."},
  {h:"was and wo",
   body:`<p><span class="de">was</span> replaces the pronoun after indefinite antecedents and whole clauses; <span class="de">wo</span> can stand in for a place.</p>`,
   table:[["Antecedent","Pronoun","Example"],["alles, etwas, nichts, das","was","Alles, was du sagst, stimmt."],["a whole clause","was","Er kam zu spät, was mich ärgerte."],["a superlative neuter","was","Das Beste, was mir passiert ist."],["a place","wo / in dem","Die Stadt, wo ich wohne …"]],
   ex:[["Es gibt nichts, was ich ändern kann.","There is nothing I can change."]],
   tip:"Commas around a relative clause are compulsory in German, unlike in English."}
 ],

  {h:"The forms",
   body:`<p>Masculine and neuter nouns take an extra <span class="de">-s</span> or <span class="de">-es</span>; feminine and plural nouns do not change.</p>`,

{
 id:22, level:"B1", title:"Infinitivsätze mit zu", sub:"um…zu, ohne…zu, statt…zu",
 goal:"Build compact infinitive clauses instead of heavy subordinate ones.",
 concepts:[
  {h:"Verbs that take zu + infinitive",
   body:`<p>Many verbs are followed by an infinitive clause with <span class="de">zu</span>, which sits directly in front of the infinitive at the end of the clause.</p>`,
   table:[["Verb","Example"],["versuchen","Ich versuche, früher aufzustehen."],["vergessen","Vergiss nicht, mich anzurufen."],["anfangen / beginnen","Er fing an, Deutsch zu lernen."],["hoffen","Wir hoffen, bald zu kommen."],["Lust haben","Ich habe Lust, ins Kino zu gehen."],["es ist + adjective","Es ist wichtig, viel zu lesen."]],
   ex:[["Ich habe vor, nach Wien zu ziehen.","I intend to move to Vienna."]],
   tip:"With separable verbs, <b>zu</b> slots inside the word: auf<b>zu</b>stehen, an<b>zu</b>rufen, mit<b>zu</b>kommen."},
  {h:"No zu after modals and a few others",
   body:`<p>Modal verbs, plus <span class="de">sehen, hören, lassen, bleiben, gehen</span>, take a bare infinitive.</p>`,
   table:[["With zu","Without zu"],["Ich versuche zu schlafen.","Ich will schlafen."],["Es ist schön, hier zu sein.","Ich höre ihn singen."],["Ich hoffe, dich zu sehen.","Ich lasse das Auto reparieren."]],
   ex:[["Ich gehe schwimmen.","I am going swimming."]],
   tip:"<b>lassen</b> means both <i>to let</i> and <i>to have something done</i>: <i>Ich lasse mir die Haare schneiden.</i>"},
  {h:"um…zu, ohne…zu, statt…zu",
   body:`<p>These three express purpose, absence and substitution. They work only when both halves share the same subject — otherwise you need <span class="de">damit</span>.</p>`,
   table:[["Structure","Meaning","Example"],["um … zu","in order to","Ich lerne Deutsch, um in Wien zu studieren."],["ohne … zu","without doing","Er ging, ohne etwas zu sagen."],["statt … zu","instead of doing","Statt zu arbeiten, schlief er."],["damit","so that (different subjects)","Ich spreche langsam, damit du mich verstehst."]],
   ex:[["Ich stehe früh auf, um den Zug zu erreichen.","I get up early in order to catch the train."]],
   tip:"Same subject → <b>um…zu</b>. Different subjects → <b>damit</b>. That single test decides it every time."}
 ],
 practice:[
  {type:"fill",q:"Ich versuche, früher ___.",sub:"…to get up earlier (aufstehen)",a:["aufzustehen"],ex:"With separable verbs zu goes between prefix and stem: aufzustehen."},
  {type:"mc",q:"Which sentence needs damit, not um…zu?",options:["Ich lerne, um zu bestehen.","Ich spreche langsam, damit du mich verstehst.","Ich komme, um zu helfen.","Ich spare, um zu reisen."],a:1,ex:"Two different subjects (ich / du) force damit."},
  {type:"order",q:"Build: He left without saying anything.",words:["Er","ging,","ohne","etwas","zu","sagen"],a:"Er ging, ohne etwas zu sagen",ex:"ohne … zu brackets the infinitive at the end."},
  {type:"mc",q:"Which verb takes a bare infinitive with no zu?",options:["versuchen","hoffen","lassen","vergessen"],a:2,ex:"lassen, sehen, hören, gehen and the modals take no zu."},
  {type:"fill",q:"Es ist wichtig, viel ___ lesen.",sub:"It is important to read a lot.",a:["zu"],ex:"es ist + adjective introduces a zu-infinitive."},
  {type:"order",q:"Build: I am learning German in order to study in Vienna.",words:["Ich","lerne","Deutsch,","um","in","Wien","zu","studieren"],a:"Ich lerne Deutsch, um in Wien zu studieren",ex:"um at the start of the clause, zu immediately before the infinitive."}
 ],
 checkpoint:[
  {type:"fill",q:"Vergiss nicht, mich ___!",sub:"Do not forget to call me. (anrufen)",a:["anzurufen"],ex:"anrufen is separable: anzurufen."},
  {type:"mc",q:"'Ich lasse mir die Haare schneiden' means:",options:["I cut my own hair.","I am having my hair cut.","I let my hair grow.","I want a haircut."],a:1,ex:"lassen expresses having something done by someone else."},
  {type:"order",q:"Build: Instead of working, he slept.",words:["Statt","zu","arbeiten,","schlief","er"],a:"Statt zu arbeiten, schlief er",ex:"The fronted infinitive clause is slot 1, so the verb follows."},
  {type:"mc",q:"Which is correct?",options:["Ich will zu schlafen.","Ich will schlafen.","Ich will zu schlafen gehen.","Ich will schlafen zu."],a:1,ex:"Modal verbs never take zu."},
  {type:"fill",q:"Ich stehe früh auf, ___ den Zug zu erreichen.",sub:"in order to catch the train",a:["um"],ex:"um … zu expresses purpose with a shared subject."}
 ],
 talk:{title:"Purpose and intention",task:"Explain three things you do and why, using um…zu. Add one ohne…zu and one damit sentence.",starter:"Hallo! Warum machst du bestimmte Dinge in deinem Alltag? Benutze bitte um … zu."}
},
{
 id:23, level:"B1", title:"Indirekte Fragen und Konnektoren", sub:"Reporting questions, and finer linking",
 goal:"Report questions politely and connect arguments with precision.",
 concepts:[
  {h:"Indirect questions",
   body:`<p>An embedded question becomes a subordinate clause: the verb travels to the end and the question mark usually disappears.</p>`,
   table:[["Direct","Indirect"],["Wo wohnst du?","Ich möchte wissen, wo du wohnst."],["Kommt er mit?","Ich frage mich, ob er mitkommt."],["Wann fängt der Film an?","Können Sie mir sagen, wann der Film anfängt?"],["Warum ist das so?","Ich verstehe nicht, warum das so ist."]],
   ex:[["Weißt du, ob der Laden noch offen ist?","Do you know whether the shop is still open?"]],
   tip:"Yes/no questions need <b>ob</b>. W-questions keep their question word, which now does the job of the conjunction."},
  {h:"Politeness through indirectness",
   body:`<p>Turning a blunt question into an indirect one is the standard German politeness move, especially with strangers.</p>`,
   table:[["Blunt","Polite"],["Wo ist der Bahnhof?","Könnten Sie mir sagen, wo der Bahnhof ist?"],["Wie viel kostet das?","Darf ich fragen, wie viel das kostet?"],["Hast du Zeit?","Ich wollte fragen, ob du Zeit hast."]],
   ex:[["Wissen Sie vielleicht, wann der Zug abfährt?","Do you happen to know when the train leaves?"]],
   tip:"Add <b>vielleicht</b> or <b>eventuell</b> to soften further. German politeness works by length and indirectness, not by extra <i>please</i>."},
  {h:"Precision connectors",
   body:`<p>Beyond weil and aber, these give your arguments structure.</p>`,
   table:[["Connector","Type","Meaning"],["falls / sofern","subordinating","in case / provided that"],["seitdem","subordinating","since (time)"],["während","subordinating","while / whereas"],["indem","subordinating","by doing something"],["je … desto","paired","the more … the more"],["entweder … oder","paired","either … or"],["weder … noch","paired","neither … nor"]],
   ex:[["Man lernt eine Sprache, indem man sie benutzt.","You learn a language by using it."],["Je mehr ich lerne, desto besser verstehe ich.","The more I learn, the better I understand."]],
   tip:"<b>je … desto</b> has a fixed shape: verb at the end after <i>je</i>, verb second after <i>desto</i>."}
 ],
 practice:[
  {type:"order",q:"Build: I would like to know where you live.",words:["Ich","möchte","wissen,","wo","du","wohnst"],a:"Ich möchte wissen, wo du wohnst",ex:"The W-word introduces the clause and the verb goes to the end."},
  {type:"fill",q:"Ich frage mich, ___ er mitkommt.",sub:"…whether he is coming along",a:["ob"],ex:"Indirect yes/no questions require ob."},
  {type:"mc",q:"Which is the politest?",options:["Wo ist der Bahnhof?","Sag mir, wo der Bahnhof ist.","Könnten Sie mir sagen, wo der Bahnhof ist?","Bahnhof?"],a:2,ex:"Konjunktiv II plus an indirect question is the standard polite form."},
  {type:"mc",q:"'Man lernt eine Sprache, ___ man sie benutzt.' — by using it",options:["damit","indem","obwohl","falls"],a:1,ex:"indem expresses the means by which something happens."},
  {type:"order",q:"Build: The more I learn, the better I understand.",words:["Je","mehr","ich","lerne,","desto","besser","verstehe","ich"],a:"Je mehr ich lerne, desto besser verstehe ich",ex:"je + verb final, desto + verb second."},
  {type:"mc",q:"'___ du Zeit hast, ruf mich an.' — in case you have time",options:["Falls","Indem","Seitdem","Während"],a:0,ex:"falls = in case / if, and it is subordinating."}
 ],
 checkpoint:[
  {type:"fill",q:"Weißt du, ___ der Laden noch offen ist?",sub:"…whether the shop is still open",a:["ob"],ex:"ob for an embedded yes/no question."},
  {type:"order",q:"Build: Can you tell me when the film starts?",words:["Können","Sie","mir","sagen,","wann","der","Film","anfängt"],a:"Können Sie mir sagen, wann der Film anfängt",ex:"anfangen is separable, and in a subordinate clause it rejoins at the end: anfängt."},
  {type:"mc",q:"'weder … noch' means:",options:["either … or","neither … nor","not only … but also","both … and"],a:1,ex:"weder … noch is the negative pair."},
  {type:"mc",q:"Which connector marks a contrast between two situations?",options:["indem","während","seitdem","falls"],a:1,ex:"während has two jobs: while (time) and whereas (contrast)."},
  {type:"fill",q:"___ ich in Berlin wohne, spreche ich besser Deutsch.",sub:"Since I have lived in Berlin… (time)",a:["seitdem","seit"],ex:"seitdem introduces a time clause with the verb at the end."}
 ],
 talk:{title:"Ask politely",task:"Ask your tutor four indirect questions, then argue a small point using je…desto and indem.",starter:"Hallo! Stell mir bitte ein paar höfliche indirekte Fragen — ich antworte gern."}
},
{
 id:24, level:"B1", title:"Verben mit Präpositionen", sub:"Fixed prepositions and da-/wo- compounds",
 goal:"Learn the prepositions verbs demand, and handle darauf, worauf and friends.",
 concepts:[
  {h:"The preposition is part of the verb",
   body:`<p>These combinations are not logical and must be memorised as units, together with their case.</p>`,
   table:[["Verb + preposition","Case","Example"],["warten auf","acc.","Ich warte auf den Bus."],["sich freuen auf / über","acc.","Ich freue mich auf den Urlaub."],["denken an","acc.","Ich denke oft an dich."],["sich interessieren für","acc.","Sie interessiert sich für Kunst."],["sprechen über / von","acc. / dat.","Wir sprechen über das Problem."],["teilnehmen an","dat.","Er nimmt an dem Kurs teil."],["gehören zu","dat.","Das gehört zu meinen Aufgaben."],["abhängen von","dat.","Das hängt von dir ab."]],
   ex:[["Ich ärgere mich über den Lärm.","I am annoyed about the noise."]],
   tip:"Record new verbs as a three-part chunk: <b>sich bewerben um + Akkusativ</b>. The preposition is as important as the verb."},
  {h:"da- compounds replace things, not people",
   body:`<p>If the object is a thing, you cannot say <i>auf es</i>. You fuse the preposition with <span class="de">da-</span> (or <span class="de">dar-</span> before a vowel). For people, normal pronouns are used.</p>`,
   table:[["Object","Form","Example"],["thing","da(r) + preposition","Ich warte darauf."],["person","preposition + pronoun","Ich warte auf ihn."],["thing, before a vowel","dar-","davon, darüber, daran, darin"]],
   ex:[["Ich denke oft daran.","I often think about it."],["Ich denke oft an sie.","I often think about her."]],
   tip:"<b>da-</b> also points forward to a following clause: <i>Ich freue mich darauf, dich zu sehen.</i>"},
  {h:"wo- compounds for questions",
   body:`<p>The question version works the same way: <span class="de">wo(r)-</span> plus the preposition for things, <span class="de">preposition + wen/wem</span> for people.</p>`,
   table:[["Question about","Form","Example"],["a thing","wo(r) + prep.","Worauf wartest du?"],["a person (acc.)","auf wen","Auf wen wartest du?"],["a person (dat.)","mit wem","Mit wem sprichst du?"]],
   ex:[["Wovon redest du?","What are you talking about?"],["Worüber freust du dich?","What are you pleased about?"]],
   tip:"Mixing these up is the clearest marker of a B1 speaker. Getting them right sounds instantly advanced."}
 ],
 practice:[
  {type:"fill",q:"Ich warte ___ den Bus.",sub:"I am waiting for the bus.",a:["auf"],ex:"warten auf + accusative."},
  {type:"mc",q:"'Ich denke oft ___ dich.'",options:["an","auf","über","für"],a:0,ex:"denken an + accusative."},
  {type:"mc",q:"'Wartest du auf den Bus?' — 'Ja, ich warte ___.'",options:["auf ihn","darauf","darüber","auf es"],a:1,ex:"A thing takes a da-compound: darauf. auf es is impossible."},
  {type:"fill",q:"___ wartest du?",sub:"What are you waiting for? (a thing)",a:["worauf"],ex:"wo + auf becomes worauf with the linking -r-."},
  {type:"mc",q:"'Das hängt ___ dir ab.'",options:["von","auf","an","über"],a:0,ex:"abhängen von + dative."},
  {type:"order",q:"Build: I am looking forward to seeing you.",words:["Ich","freue","mich","darauf,","dich","zu","sehen"],a:"Ich freue mich darauf, dich zu sehen",ex:"darauf points forward to the zu-clause that follows."}
 ],
 checkpoint:[
  {type:"mc",q:"'Auf wen wartest du?' asks about:",options:["a thing","a person","a place","a time"],a:1,ex:"Prepositions plus wen/wem ask about people; wo-compounds ask about things."},
  {type:"fill",q:"Er nimmt ___ dem Kurs teil.",sub:"He is taking part in the course.",a:["an"],ex:"teilnehmen an + dative."},
  {type:"mc",q:"Which is correct for 'I am annoyed about it'?",options:["Ich ärgere mich über es.","Ich ärgere mich darüber.","Ich ärgere mich darauf.","Ich ärgere mich davon."],a:1,ex:"über + thing becomes darüber."},
  {type:"fill",q:"___ sprichst du?",sub:"Who are you speaking with? (a person, sprechen mit)",a:["mit wem"],ex:"For people the preposition keeps a normal pronoun: mit wem."},
  {type:"mc",q:"Best way to learn these verbs?",options:["Learn the verb alone","Learn verb + preposition + case as one chunk","Guess from English","Use the dative always"],a:1,ex:"The English preposition rarely matches, so the chunk must be stored whole."}
 ],
 talk:{title:"What are you into?",task:"Tell your tutor what you are interested in, what you are waiting for, what annoys you and what you are looking forward to. Use four different verb-plus-preposition pairs.",starter:"Hallo! Wofür interessierst du dich, und worüber ärgerst du dich manchmal?"}
}
];

{
 id:25, level:"B2", title:"Passiv-Alternativen", sub:"Zustandspassiv, man, sich lassen",
 goal:"Choose between the real passive and the four structures Germans use instead.",
 concepts:[
  {h:"Vorgangspassiv vs Zustandspassiv",
   body:`<p><span class="de">werden</span> describes the <b>process</b>; <span class="de">sein</span> describes the <b>resulting state</b>. Mixing them changes the meaning completely.</p>`,
   table:[["Form","Example","Meaning"],["Vorgangspassiv (werden)","Die Tür wird geschlossen.","The door is being closed — right now, someone is doing it."],["Zustandspassiv (sein)","Die Tür ist geschlossen.","The door is closed — that is its state."],["Past process","Die Tür wurde geschlossen.","The door was closed (the act)."],["Past state","Die Tür war geschlossen.","The door was closed (it stood shut)."]],
   ex:[["Das Geschäft ist bis Montag geschlossen.","The shop is closed until Monday."]],
   tip:"Test: if you could add <i>gerade</i> (right now), you need <b>werden</b>."},
  {h:"The four passive substitutes",
   body:`<p>German avoids heavy passives in speech by using these instead. All express roughly <i>can be done</i> or <i>is done</i>.</p>`,
   table:[["Structure","Example","Equivalent"],["man","Man macht das so.","Das wird so gemacht."],["sich lassen","Das lässt sich reparieren.","Das kann repariert werden."],["sein + zu + Infinitiv","Das ist leicht zu verstehen.","Das kann leicht verstanden werden."],["-bar / -lich adjective","Das ist machbar / verständlich.","Das kann gemacht / verstanden werden."],["reflexive","Die Tür öffnet sich.","Die Tür wird geöffnet."]],
   ex:[["Der Fehler lässt sich leicht beheben.","The mistake can easily be fixed."]],
   tip:"<b>sich lassen</b> and <b>sein + zu</b> both carry a modal meaning of possibility — they replace <i>kann … werden</i>, not the plain passive."},
  {h:"Register in practice",
   body:`<p>Choosing the right one is a B2 skill: each belongs to a different context.</p>`,
   table:[["Context","Preferred form"],["Spoken, general statements","man"],["Instructions, manuals","Imperativ or werden-Passiv"],["Notices and signs","Zustandspassiv: Geöffnet / Geschlossen"],["Academic writing","werden-Passiv and nominal style"],["Talking about feasibility","sich lassen, -bar"]],
   ex:[["Hier spricht man Deutsch.","German is spoken here."],["Das Formular ist bis Freitag einzureichen.","The form is to be submitted by Friday."]],
   tip:"<b>sein + zu + Infinitiv</b> in official texts often means <i>must</i>, not just <i>can</i>: <i>ist einzureichen</i> = must be submitted."}
 ],
 practice:[
  {type:"mc",q:"'Die Tür ist geschlossen' describes:",options:["the act of closing","the resulting state","a future event","a command"],a:1,ex:"sein + participle is the Zustandspassiv: a state, not a process."},
  {type:"fill",q:"Das ___ sich leicht reparieren.",sub:"That can easily be repaired. (sich lassen)",a:["lässt","laesst"],ex:"sich lassen + infinitive replaces kann … werden."},
  {type:"mc",q:"Which is closest to 'Das wird so gemacht'?",options:["Man macht das so.","Das ist gemacht.","Das muss gemacht werden.","Das war so."],a:0,ex:"man is the everyday spoken substitute for the passive."},
  {type:"mc",q:"'Das Formular ist bis Freitag einzureichen' means:",options:["The form can be submitted.","The form must be submitted by Friday.","The form has been submitted.","Someone is submitting the form."],a:1,ex:"In official German sein + zu + Infinitiv carries obligation."},
  {type:"order",q:"Build: The mistake can easily be fixed.",words:["Der","Fehler","lässt","sich","leicht","beheben"],a:"Der Fehler lässt sich leicht beheben",ex:"sich stands right after the conjugated verb; the infinitive closes the sentence."}
 ],
 checkpoint:[
  {type:"mc",q:"'Die Tür wird geschlossen' vs 'Die Tür ist geschlossen' — what is the difference?",options:["None","Process vs state","Present vs past","Formal vs informal"],a:1,ex:"werden = the closing happens; sein = it stands closed."},
  {type:"fill",q:"Hier ___ man Deutsch.",sub:"German is spoken here.",a:["spricht"],ex:"man takes a third person singular verb."},
  {type:"mc",q:"Which adjective suffix expresses 'can be done'?",options:["-ung","-bar","-heit","-los"],a:1,ex:"machbar, lesbar, essbar: -bar equals English -able."},
  {type:"order",q:"Build: That is easy to understand.",words:["Das","ist","leicht","zu","verstehen"],a:"Das ist leicht zu verstehen",ex:"sein + zu + Infinitiv expresses possibility."},
  {type:"mc",q:"On a shop door you read 'Geöffnet'. Which structure is that?",options:["Vorgangspassiv","Zustandspassiv","man-Form","Imperativ"],a:1,ex:"A state, with sein understood: (Es ist) geöffnet."}
 ],
 talk:{title:"Describe rules and possibilities",task:"Describe five rules or customs in your country without using werden — use man, sich lassen and -bar adjectives instead.",starter:"Hallo! Was macht man in deinem Land anders als in Deutschland? Vermeide bitte das Passiv mit werden."}

{
 id:26, level:"B2", title:"Konjunktiv I", sub:"Reported speech in journalism",
 goal:"Read and write indirect speech the way German newspapers do.",
 concepts:[
  {h:"Forming Konjunktiv I",
   body:`<p>Take the infinitive stem and add <span class="de">-e, -est, -e, -en, -et, -en</span>. The third person singular, ending in <span class="de">-e</span>, is the form you will actually see.</p>`,
   table:[["Infinitive","er/sie/es K I","Note"],["sagen","sage","distinct from sagt"],["haben","habe",""],["kommen","komme",""],["können","könne",""],["werden","werde",""],["sein","sei","irregular: sei, seist, sei, seien, seiet, seien"]],
   ex:[["Der Minister sagte, er habe keine Zeit.","The minister said he had no time."],["Sie erklärte, sie sei nicht informiert worden.","She explained that she had not been informed."]],
   tip:"<b>sein</b> is the only verb whose singular has no -e: <i>er sei</i>, not <i>er seie</i>."},
  {h:"When Konjunktiv I is replaced",
   body:`<p>If the Konjunktiv I form looks identical to the ordinary present (which happens in most plural forms), German switches to Konjunktiv II to keep the reporting clear.</p>`,
   table:[["Direct","Indirect","Why"],["Sie kommen später.","Sie sagten, sie kämen später.","sie kommen = identical, so K II"],["Er hat Zeit.","Er sagte, er habe Zeit.","habe is distinct, K I works"],["Wir wissen nichts.","Sie sagten, sie wüssten nichts.","wissen identical, so K II"]],
   ex:[["Die Sprecherin sagte, die Zahlen seien gestiegen.","The spokeswoman said the figures had risen."]],
   tip:"Rule of thumb: singular → Konjunktiv I; plural → often Konjunktiv II or <i>würde</i>."},
  {h:"Distance, not doubt",
   body:`<p>Konjunktiv I signals only that you are reporting someone else's words. It does not by itself say you disbelieve them — though it does keep you at arm's length.</p>`,
   table:[["Form","Effect"],["Er sagt, er ist krank.","Indicative: the speaker treats it as fact (spoken style)."],["Er sagt, er sei krank.","Konjunktiv I: neutral reporting, typical of journalism."],["Er sagt, er wäre krank.","Konjunktiv II: often hints at scepticism in speech."],["Er sagt, dass er krank ist.","With dass: everyday spoken German."]],
   ex:[["Laut Polizei sei niemand verletzt worden.","According to the police, nobody was injured."]],
   tip:"Past reported speech always uses <b>habe / sei + Partizip II</b>, whatever tense the original had."}
 ],
 practice:[
  {type:"fill",q:"Der Minister sagte, er ___ keine Zeit.",sub:"…that he had no time (haben, Konjunktiv I)",a:["habe"],ex:"Third person Konjunktiv I of haben is habe."},
  {type:"mc",q:"Konjunktiv I of sein, third person singular?",options:["seie","sei","wäre","ist"],a:1,ex:"sein is irregular and has the bare form sei."},
  {type:"mc",q:"Why does 'Sie sagten, sie kämen später' use Konjunktiv II?",options:["It is more polite","The Konjunktiv I form would look like the indicative","It refers to the past","Plural always uses II"],a:1,ex:"sie kommen is ambiguous, so German switches to kämen."},
  {type:"fill",q:"Sie erklärte, sie ___ nicht informiert worden.",sub:"…that she had not been informed (sein)",a:["sei"],ex:"Passive in reported speech: sei + Partizip II + worden."},
  {type:"order",q:"Build: According to the police nobody was injured.",words:["Laut","Polizei","sei","niemand","verletzt","worden"],a:"Laut Polizei sei niemand verletzt worden",ex:"Konjunktiv I passive in the past: sei … worden."}
 ],
 checkpoint:[
  {type:"mc",q:"Where do you mainly encounter Konjunktiv I?",options:["Casual conversation","News reports and formal writing","Recipes","Advertising slogans"],a:1,ex:"It is the register of journalism, minutes and formal reporting."},

{
 id:27, level:"B2", title:"Partizipien als Adjektive", sub:"Participle I and II, extended attributes",
 goal:"Compress a relative clause into a participle phrase before the noun.",
 concepts:[
  {h:"Two participles, two meanings",
   body:`<p><b>Partizip I</b> (infinitive + <span class="de">d</span>) is active and ongoing. <b>Partizip II</b> is passive or completed. Both take normal adjective endings.</p>`,
   table:[["Form","Build","Example","Meaning"],["Partizip I","spielen + d","das spielende Kind","the child who is playing"],["Partizip II","gekocht","das gekochte Essen","the food that has been cooked"],["Partizip I","laufen + d","das laufende Verfahren","the ongoing procedure"],["Partizip II","geschrieben","der geschriebene Text","the text that was written"]],
   ex:[["Die steigenden Preise sind ein Problem.","The rising prices are a problem."],["Der verlorene Schlüssel war im Auto.","The lost key was in the car."]],
   tip:"Partizip I = <i>-ing</i>, Partizip II = <i>-ed</i>. A verb of motion or change reverses it: <i>der angekommene Zug</i> = the train that has arrived."},
  {h:"Extended attributes",
   body:`<p>German can stack a whole phrase between the article and the noun — an <span class="de">erweitertes Attribut</span>. English must use a relative clause instead.</p>`,
   table:[["Relative clause","Extended attribute"],["der Zug, der aus Berlin kommt","der aus Berlin kommende Zug"],["die Frage, die gestern gestellt wurde","die gestern gestellte Frage"],["das Kind, das im Garten spielt","das im Garten spielende Kind"]],
   ex:[["Die von der Regierung beschlossenen Maßnahmen treten morgen in Kraft.","The measures decided by the government come into force tomorrow."]],
   tip:"To read one, find the article, then jump to the noun at the end, then unpack the middle backwards. That is how Germans parse them too."},
  {h:"Gerundivum: zu + Partizip I",
   body:`<p>The construction <span class="de">zu + Partizip I</span> as an adjective expresses necessity or possibility in the passive — extremely common in bureaucratic and academic German.</p>`,
   table:[["Form","Meaning","Equivalent"],["die zu lösende Aufgabe","the task that must be solved","die Aufgabe, die gelöst werden muss"],["das zu erwartende Ergebnis","the expected result","das Ergebnis, das erwartet werden kann"],["die zu zahlende Summe","the amount payable","die Summe, die gezahlt werden muss"]],
   ex:[["Die noch zu klärenden Fragen stehen auf Seite drei.","The questions still to be clarified are on page three."]],
   tip:"Do not confuse <i>die lösende Aufgabe</i> (nonsense) with <b>die zu lösende Aufgabe</b>. The <i>zu</i> flips it into a passive obligation."}
 ],
 practice:[
  {type:"mc",q:"'das spielende Kind' means:",options:["the child that was played with","the child who is playing","the child to be played with","the played child"],a:1,ex:"Partizip I is active and simultaneous."},
  {type:"fill",q:"die ___ Preise",sub:"the rising prices (steigen, Partizip I, plural nominative)",a:["steigenden"],ex:"steigen + d + plural ending -en."},
  {type:"mc",q:"Rewrite 'der Zug, der aus Berlin kommt' as an extended attribute:",options:["der aus Berlin kommende Zug","der aus Berlin gekommene Zug","der Zug aus Berlin kommend","der kommende aus Berlin Zug"],a:0,ex:"Partizip I with the adjective ending, everything before the noun."},
  {type:"mc",q:"'die zu lösende Aufgabe' means:",options:["the task that solves","the task that must be solved","the solved task","the solving task"],a:1,ex:"zu + Partizip I expresses passive necessity."},
  {type:"fill",q:"der ___ Schlüssel",sub:"the lost key (verlieren, Partizip II)",a:["verlorene"],ex:"Partizip II verloren plus the weak masculine ending -e."}
 ],
 checkpoint:[
  {type:"mc",q:"Partizip I of laufen?",options:["gelaufen","laufend","laufen","läufend"],a:1,ex:"Infinitive plus d: laufend."},
  {type:"order",q:"Build: the question asked yesterday",words:["die","gestern","gestellte","Frage"],a:"die gestern gestellte Frage",ex:"Article, then the modifiers, then the participle, then the noun."},
  {type:"mc",q:"'der angekommene Zug' means:",options:["the arriving train","the train that has arrived","the train to arrive","the departing train"],a:1,ex:"With motion verbs that take sein, Partizip II means completed action, not passive."},
  {type:"fill",q:"das zu ___ Ergebnis",sub:"the expected result (erwarten)",a:["erwartende"],ex:"zu + erwartend + weak neuter ending -e."},
  {type:"mc",q:"Why does German use extended attributes so heavily in academic text?",options:["They are shorter than relative clauses","They avoid the genitive","They sound friendlier","They are obligatory"],a:0,ex:"They compress information densely, which is prized in formal written German."}
 ],
 talk:{title:"Compress your language",task:"Say four sentences with relative clauses, then repeat each as an extended attribute.",starter:"Hallo! Sag mir einen Satz mit Relativsatz — und dann formuliere ihn als erweitertes Attribut um."}
},
{
 id:28, level:"B2", title:"Nomen-Verb-Verbindungen", sub:"Funktionsverbgefüge and formal collocations",
 goal:"Use the fixed noun-plus-verb phrases that dominate formal German.",
 concepts:[
  {h:"What a Funktionsverbgefüge is",
   body:`<p>A pale verb plus a noun carries the meaning together: <span class="de">eine Entscheidung treffen</span> rather than <span class="de">entscheiden</span>. It is heavier, more formal, and everywhere in official language.</p>`,
   table:[["Phrase","Simple verb","English"],["eine Entscheidung treffen","entscheiden","to make a decision"],["zur Verfügung stehen","verfügbar sein","to be available"],["in Kraft treten","gelten","to come into force"],["Rücksicht nehmen auf","berücksichtigen","to take into consideration"],["Kritik üben an","kritisieren","to criticise"],["zum Ausdruck bringen","ausdrücken","to express"]],
   ex:[["Die Regierung hat eine Entscheidung getroffen.","The government has made a decision."]],
   tip:"The verb is nearly empty of meaning — you cannot translate it literally. <i>treffen</i> here is not <i>to meet</i>."},
  {h:"The verb is not interchangeable",
   body:`<p>Each noun demands a specific verb. Choosing the wrong one is grammatically fine but instantly wrong to a native ear.</p>`,
   table:[["Correct","Wrong","Meaning"],["eine Frage stellen","eine Frage machen","to ask a question"],["einen Fehler machen","einen Fehler tun","to make a mistake"],["Sport treiben","Sport machen (casual only)","to do sport"],["eine Rolle spielen","eine Rolle haben","to play a role"],["Aufmerksamkeit schenken","Aufmerksamkeit geben","to pay attention"],["Maßnahmen ergreifen","Maßnahmen nehmen","to take measures"]],
   ex:[["Diese Frage spielt eine wichtige Rolle.","This question plays an important role."]],
   tip:"Collocations cannot be derived. Collect them as you read German news, which is saturated with them."},
  {h:"Typical prepositions inside them",
   body:`<p>Most of these phrases come with a fixed preposition too, and the whole chunk must be learned together.</p>`,
   table:[["Phrase","Preposition","Example"],["Einfluss nehmen","auf + acc.","Er nimmt Einfluss auf die Entscheidung."],["Anspruch haben","auf + acc.","Sie hat Anspruch auf Urlaub."],["in Verbindung stehen","mit + dat.","Wir stehen mit ihm in Verbindung."],["Wert legen","auf + acc.","Ich lege großen Wert auf Pünktlichkeit."],["Abschied nehmen","von + dat.","Er nahm Abschied von seiner Familie."]],
   ex:[["Wir legen großen Wert auf Qualität.","We place great importance on quality."]],
   tip:"These phrases raise your register instantly. Two or three well-placed ones make a B2 essay read like C1."}
 ],
 practice:[
  {type:"mc",q:"'eine Entscheidung ___'",options:["machen","treffen","nehmen","geben"],a:1,ex:"The fixed verb is treffen: eine Entscheidung treffen."},
  {type:"fill",q:"Darf ich eine Frage ___?",sub:"May I ask a question?",a:["stellen"],ex:"eine Frage stellen, never eine Frage machen."},
  {type:"mc",q:"'in Kraft treten' means:",options:["to get strong","to come into force","to force someone","to work hard"],a:1,ex:"Used of laws and regulations."},
  {type:"fill",q:"Ich lege großen Wert ___ Pünktlichkeit.",sub:"I place great value on punctuality.",a:["auf"],ex:"Wert legen auf + accusative."},
  {type:"mc",q:"Which is standard written German?",options:["Maßnahmen nehmen","Maßnahmen ergreifen","Maßnahmen tun","Maßnahmen geben"],a:1,ex:"Maßnahmen ergreifen is the fixed collocation."}
 ],
 checkpoint:[
  {type:"fill",q:"Die Unterlagen stehen Ihnen zur ___.",sub:"The documents are available to you.",a:["verfügung"],ex:"zur Verfügung stehen is one of the commonest formal phrases."},
  {type:"mc",q:"'Kritik üben an' takes which case?",options:["accusative","dative","genitive","nominative"],a:1,ex:"an + dative: Kritik üben an dem Vorschlag."},
  {type:"mc",q:"Simple verb behind 'zum Ausdruck bringen'?",options:["drücken","ausdrücken","bringen","drucken"],a:1,ex:"ausdrücken. The Funktionsverbgefüge is the formal variant."},
  {type:"fill",q:"Diese Frage spielt eine wichtige ___.",sub:"This question plays an important role.",a:["rolle"],ex:"eine Rolle spielen."},
  {type:"mc",q:"Why do these phrases matter at B2?",options:["They are grammatically simpler","They mark formal register and cannot be derived logically","They replace the passive","They avoid cases"],a:1,ex:"They are fixed chunks that signal command of the formal variety."}
 ],
 talk:{title:"Speak formally",task:"Give a short formal opinion on a public issue using at least four Nomen-Verb-Verbindungen.",starter:"Hallo! Nehmen Sie bitte formell Stellung zu einem aktuellen Thema Ihrer Wahl."}
},
{
 id:29, level:"B2", title:"Schriftsprachliche Konnektoren", sub:"Argumentative linking and sentence rhythm",
 goal:"Structure a written argument with the connectors examiners look for.",
 concepts:[
  {h:"Beyond aber and deshalb",
   body:`<p>Written German distinguishes fine shades of contrast, cause and concession. Each connector has its own word-order behaviour.</p>`,
   table:[["Connector","Meaning","Position effect"],["jedoch","however","slot 1 or mid-field, verb second"],["dennoch","nevertheless","slot 1, verb second"],["allerdings","admittedly / however","slot 1 or mid-field"],["folglich / somit","consequently","slot 1, verb second"],["zumal","especially since","subordinating, verb last"],["sofern","provided that","subordinating, verb last"],["insofern als","in so far as","subordinating, verb last"]],
   ex:[["Die Idee ist gut, jedoch fehlt das Geld.","The idea is good; however, the money is missing."],["Er kam nicht, zumal er krank war.","He did not come, especially since he was ill."]],
   tip:"A connector in slot 1 pushes the subject behind the verb. Forgetting that is the most common B2 written error."},
  {h:"Building an argument",
   body:`<p>Examiners reward visible structure. These sequences do the signposting.</p>`,
   table:[["Function","Phrases"],["Introducing","Zunächst ist festzuhalten, dass … / In Bezug auf …"],["Adding","Darüber hinaus / Ferner / Nicht zuletzt"],["Contrasting","Demgegenüber / Im Gegensatz dazu / Einerseits … andererseits"],["Conceding","Zwar …, aber … / Gewiss, jedoch …"],["Concluding","Abschließend lässt sich sagen, dass … / Insgesamt betrachtet"]],
   ex:[["Zwar ist der Plan teuer, aber er ist notwendig.","The plan is admittedly expensive, but it is necessary."]],
   tip:"<b>zwar … aber</b> is the elegant German way to concede a point before overturning it. Use it once per essay."},
  {h:"Sentence rhythm",
   body:`<p>Good written German alternates long and short sentences and avoids beginning every sentence with the subject. Fronting a time, place or object gives movement.</p>`,
   table:[["Flat","Better"],["Ich habe das Buch gestern gelesen. Ich fand es gut.","Gestern habe ich das Buch gelesen. Gut fand ich vor allem den Schluss."],["Man muss die Kosten beachten. Man muss auch den Nutzen sehen.","Neben den Kosten ist auch der Nutzen zu beachten."]],
   ex:[["Besonders auffällig ist dabei der Anstieg der Mieten.","Particularly striking here is the rise in rents."]],
   tip:"Fronting the most important information is not stylistic decoration in German — it is how emphasis is marked at all."}
 ],
 practice:[
  {type:"mc",q:"'Die Idee ist gut, jedoch ___ das Geld.'",options:["fehlt","fehlen","das Geld fehlt","fehlte es"],a:0,ex:"jedoch occupies slot 1, so the verb must come second and the subject follows."},
  {type:"mc",q:"Which connector sends the verb to the end?",options:["dennoch","folglich","zumal","allerdings"],a:2,ex:"zumal is subordinating."},
  {type:"fill",q:"___ ist der Plan teuer, aber er ist notwendig.",sub:"Admittedly the plan is expensive…",a:["zwar"],ex:"zwar … aber is the standard concession pair."},
  {type:"order",q:"Build: Consequently the costs rise.",words:["Folglich","steigen","die","Kosten"],a:"Folglich steigen die Kosten",ex:"Connector in slot 1, verb second, subject third."},
  {type:"mc",q:"Best phrase to close an argumentative text?",options:["Zunächst einmal","Darüber hinaus","Abschließend lässt sich sagen","Im Gegensatz dazu"],a:2,ex:"It signals the conclusion explicitly."}
 ],
 checkpoint:[
  {type:"mc",q:"'Er kam nicht, zumal er krank ___.'",options:["war","er war","ist war","war er"],a:0,ex:"zumal is subordinating, so the verb closes the clause."},
  {type:"mc",q:"What happens to the subject when a connector occupies slot 1?",options:["It disappears","It moves behind the verb","It takes the dative","Nothing"],a:1,ex:"Verb-second is absolute, so the subject is displaced to third position."},
  {type:"fill",q:"___ hinaus muss der Zeitplan geprüft werden.",sub:"Furthermore… (Darüber ___)",a:["darüber","darueber"],ex:"Darüber hinaus = moreover."},
  {type:"mc",q:"Which pair expresses two sides of an issue?",options:["zwar … aber","einerseits … andererseits","weder … noch","je … desto"],a:1,ex:"einerseits … andererseits balances two aspects."},
  {type:"order",q:"Build: In contrast to this, the costs are falling.",words:["Im","Gegensatz","dazu","sinken","die","Kosten"],a:"Im Gegensatz dazu sinken die Kosten",ex:"The whole phrase fills slot 1, so the verb comes next."}
 ],
 talk:{title:"Argue a case",task:"Argue for or against a proposal in five sentences, using zwar…aber, jedoch, darüber hinaus and a concluding phrase.",starter:"Hallo! Sollte man in Städten Autos verbieten? Argumentieren Sie bitte strukturiert."}
},
{
 id:30, level:"B2", title:"Wortbildung", sub:"Prefixes, suffixes and meaning shifts",
 goal:"Decode unfamiliar words and multiply your vocabulary by system rather than by lists.",
 concepts:[
  {h:"Verb prefixes change everything",
   body:`<p>One stem plus a prefix gives a family of verbs with related but distinct meanings. Inseparable prefixes are unstressed; separable ones are stressed and detach.</p>`,
   table:[["Prefix","Force","Example from stehen / suchen"],["be-","makes a verb transitive","besuchen — to visit"],["ver-","away, wrongly, completion","versuchen — to try; verlaufen — to go astray"],["ent-","removal, escape","entstehen — to arise; entkommen — to escape"],["zer-","destruction","zerstören — to destroy; zerbrechen — to shatter"],["er-","achieving a result","erreichen — to reach; erfinden — to invent"],["miss-","wrongly","missverstehen — to misunderstand"]],
   ex:[["Ich habe mich versprochen.","I misspoke."],["Das Gebäude wurde zerstört.","The building was destroyed."]],
   tip:"Inseparable prefixes (be-, ge-, er-, ver-, zer-, ent-, emp-, miss-) never take <b>ge-</b> in the participle: <i>besucht</i>, <i>verstanden</i>."},
  {h:"Noun suffixes and their genders",
   body:`<p>Suffixes tell you both the meaning and the gender, which makes them doubly valuable.</p>`,
   table:[["Suffix","Gender","Meaning","Example"],["-ung","die","the action or result","die Verbesserung"],["-keit / -heit","die","quality","die Möglichkeit, die Freiheit"],["-schaft","die","collective / state","die Freundschaft"],["-er","der","agent or instrument","der Fahrer, der Drucker"],["-nis","das (mostly)","result or state","das Ergebnis"],["-chen","das","diminutive","das Häuschen"]],
   ex:[["Die Entscheidung war schwierig.","The decision was difficult."]],
   tip:"From almost any verb you can make a noun with <b>-ung</b>: entscheiden → die Entscheidung, bilden → die Bildung."},
  {h:"Adjective suffixes",
   body:`<p>These convert nouns and verbs into adjectives with predictable meanings.</p>`,
   table:[["Suffix","Meaning","Example"],["-bar","can be done","lesbar, essbar, machbar"],["-lich","characteristic of","freundlich, täglich, gefährlich"],["-ig","having the quality","sonnig, wichtig, lustig"],["-los","without","arbeitslos, hoffnungslos"],["-voll","full of","wertvoll, hoffnungsvoll"],["-isch","relating to","kritisch, praktisch"]],
   ex:[["Das ist leider nicht machbar.","Unfortunately that is not feasible."]],
   tip:"When you meet an unknown long word, split it: <i>un-verständ-lich</i> = not + understand + adjective = incomprehensible."}
 ],
 practice:[
  {type:"mc",q:"What does zerstören mean?",options:["to store","to destroy","to disturb slightly","to rebuild"],a:1,ex:"zer- marks destruction."},
  {type:"fill",q:"entscheiden → die ___",sub:"Make a noun with -ung.",a:["entscheidung"],ex:"-ung nouns are feminine and describe the action or its result."},
  {type:"mc",q:"Which prefix means 'wrongly'?",options:["be-","miss-","er-","zer-"],a:1,ex:"missverstehen, misslingen, misstrauen."},
  {type:"mc",q:"Gender of Möglichkeit?",options:["der","die","das"],a:1,ex:"-keit and -heit are always feminine."},
  {type:"fill",q:"Das ist nicht ___.",sub:"not feasible (machen + -bar)",a:["machbar"],ex:"-bar equals English -able."}
 ],
 checkpoint:[
  {type:"mc",q:"Participle of verstehen?",options:["geverstanden","verstanden","verstehte","gestanden"],a:1,ex:"Inseparable ver- blocks ge-."},
  {type:"mc",q:"'arbeitslos' means:",options:["full of work","unemployed","hardworking","workable"],a:1,ex:"-los = without."},
  {type:"fill",q:"der Fahr___",sub:"the driver — agent suffix",a:["fahrer","er"],ex:"-er makes an agent noun and is masculine."},
  {type:"mc",q:"Which prefix makes an intransitive verb transitive?",options:["ent-","be-","zer-","miss-"],a:1,ex:"antworten auf etwas → etwas beantworten."},
  {type:"mc",q:"Split unverständlich. What does it mean?",options:["very understandable","incomprehensible","misunderstood","understandable later"],a:1,ex:"un- + verständ- + -lich = not able to be understood."}
 ],
 talk:{title:"Build words",task:"Take four verbs and build noun and adjective forms from them, explaining the meaning shifts in German.",starter:"Hallo! Nimm das Verb 'bilden'. Welche Wörter kannst du daraus ableiten? Erklär mir die Bedeutungen."}
}
];

 id:31, level:"C1", title:"Nominalstil und Verbalstil", sub:"Converting between the two registers",
 goal:"Move fluently between verb-heavy speech and noun-heavy formal prose.",
 concepts:[
  {h:"The same content, two shapes",
   body:`<p>German administrative and academic writing packs verbs into nouns and subordinate clauses into prepositional phrases. C1 examinations test the conversion in both directions.</p>`,
   table:[["Verbalstil (clause)","Nominalstil (phrase)"],["Weil die Preise gestiegen sind, …","Wegen des Preisanstiegs …"],["Nachdem er angekommen war, …","Nach seiner Ankunft …"],["Wenn das Wetter schlecht ist, …","Bei schlechtem Wetter …"],["Obwohl es regnete, …","Trotz des Regens …"],["Damit die Qualität steigt, …","Zur Steigerung der Qualität …"]],
   ex:[["Vor Beginn der Sitzung wurden die Unterlagen verteilt.","Before the meeting began, the documents were distributed."]],
   tip:"Each subordinating conjunction has a matching preposition: weil→wegen, obwohl→trotz, wenn→bei, nachdem→nach, bevor→vor, damit→zu."},
  {h:"How to nominalise",
   body:`<p>Turn the verb into a noun, put the old subject or object into the genitive, and choose the matching preposition.</p>`,
   table:[["Step","Example"],["1. Find the verb","Die Regierung entscheidet schnell."],["2. Nominalise","die Entscheidung"],["3. Genitive for the actor","die Entscheidung der Regierung"],["4. Add the preposition","nach der Entscheidung der Regierung"]],
   ex:[["Aufgrund der schnellen Entscheidung der Regierung blieb der Schaden gering.","Owing to the government's swift decision, the damage remained small."]],
   tip:"Nominalstil is admired in official writing and disliked in journalism. Register awareness matters as much as the mechanics."},
  {h:"When to go back to verbs",
   body:`<p>Over-nominalised German becomes unreadable. Good C1 style alternates: heavy phrase, then a short verbal sentence.</p>`,
   table:[["Too nominal","Better"],["Die Durchführung der Überprüfung der Anträge erfolgt durch die Behörde.","Die Behörde prüft die Anträge."],["Es kam zur Erhöhung der Preise.","Die Preise stiegen."]],
   ex:[["Nach Prüfung der Unterlagen entschied die Kommission, den Antrag abzulehnen.","After examining the documents, the commission decided to reject the application."]],
   tip:"<b>erfolgen</b>, <b>es kommt zu</b> and <b>die Durchführung von</b> are the classic markers of bureaucratic overkill. Recognise them; use them sparingly."}
 ],
 practice:[
  {type:"mc",q:"Nominalise 'Weil die Preise gestiegen sind, …'",options:["Trotz des Preisanstiegs","Wegen des Preisanstiegs","Nach dem Preisanstieg","Bei dem Preisanstieg"],a:1,ex:"weil corresponds to wegen plus the genitive."},
  {type:"fill",q:"Obwohl es regnete → ___ des Regens",sub:"Which preposition replaces obwohl?",a:["trotz"],ex:"obwohl → trotz + genitive."},
  {type:"mc",q:"'Bei schlechtem Wetter' unpacks as:",options:["Weil das Wetter schlecht ist","Wenn das Wetter schlecht ist","Obwohl das Wetter schlecht ist","Nachdem das Wetter schlecht war"],a:1,ex:"bei + noun corresponds to a conditional or temporal wenn clause."},
  {type:"mc",q:"Which sentence is better style?",options:["Die Durchführung der Prüfung der Anträge erfolgt durch die Behörde.","Die Behörde prüft die Anträge.","Es kommt zur Prüfung der Anträge durch die Behörde.","Die Antragsprüfungsdurchführung erfolgt behördlich."],a:1,ex:"Verbal style is clearer; nominal chains obscure the agent and the action."},
  {type:"order",q:"Build: After his arrival we began.",words:["Nach","seiner","Ankunft","begannen","wir"],a:"Nach seiner Ankunft begannen wir",ex:"The nominal phrase fills slot 1, so the verb comes second."}
 ],

  {type:"fill",q:"Damit die Qualität steigt → ___ Steigerung der Qualität",sub:"Which preposition (contracted with der)?",a:["zur"],ex:"damit → zu + nominalisation: zur Steigerung."},
  {type:"mc",q:"'Vor Beginn der Sitzung' corresponds to which conjunction?",options:["nachdem","bevor","weil","obwohl"],a:1,ex:"vor matches bevor."},
  {type:"mc",q:"Which is a hallmark of bureaucratic overkill?",options:["Die Behörde entscheidet.","Es kommt zur Erhöhung der Preise.","Die Preise steigen.","Wir prüfen den Antrag."],a:1,ex:"es kommt zu + nominalisation is the classic empty construction."},
  {type:"order",q:"Build: Owing to the decision the damage remained small.",words:["Aufgrund","der","Entscheidung","blieb","der","Schaden","gering"],a:"Aufgrund der Entscheidung blieb der Schaden gering",ex:"aufgrund + genitive, then verb second."},
  {type:"mc",q:"In which text type is Nominalstil least appropriate?",options:["A law","An administrative report","A newspaper feature","A scientific abstract"],a:2,ex:"Journalism prizes verbal clarity and short sentences."}
 ],

{
 id:32, level:"C1", title:"Modalpartikeln", sub:"doch, mal, ja, eben, wohl, halt",
 goal:"Add the tiny words that make German sound German.",
 concepts:[
  {h:"Words with no translation",
   body:`<p>Modal particles carry attitude rather than content. They are unstressed, sit in the middle field, and cannot be translated one to one — English uses intonation instead.</p>`,
   table:[["Particle","Effect","Example"],["doch","contradicts, urges, reassures","Komm doch mit! / Das weißt du doch."],["mal","casual, softening","Warte mal. / Kannst du mal helfen?"],["ja","shared knowledge, surprise","Das ist ja toll! / Du weißt ja, wie es ist."],["eben / halt","resigned acceptance","So ist es eben. / Das ist halt so."],["wohl","assumption","Er ist wohl krank."],["denn","friendly interest in a question","Was machst du denn?"]],
   ex:[["Setz dich doch mal hin!","Do sit down for a moment!"]],
   tip:"Without particles your German is correct but cold. A single <b>doch</b> or <b>mal</b> transforms a command into an invitation."},
  {h:"Position and stacking",
   body:`<p>Particles come after the subject and pronouns, before most other elements. Two or three can stack, in a fixed order: <span class="de">ja – doch – mal – eben</span>.</p>`,
   table:[["Sentence","Comment"],["Das ist ja doch nicht so schwer.","stacked, natural"],["Komm doch mal vorbei.","invitation, very common"],["Das war ja wohl nichts.","dismissive, colloquial"],["Sag mal, hast du Zeit?","opens a question casually"]],
   ex:[["Nun komm doch endlich!","Come on, do come at last!"]],
   tip:"Stress changes meaning: unstressed <i>doch</i> is a particle; stressed <b>DOCH</b> is a contradiction meaning <i>yes it is</i>."},
  {h:"doch as an answer word",
   body:`<p>German has a third answer word English lacks entirely: <span class="de">doch</span> contradicts a negative question or statement.</p>`,
   table:[["Question","Answer","Meaning"],["Kommst du nicht?","Doch!","Yes, I am coming (contradicting the negative)."],["Kommst du?","Ja.","Yes."],["Du magst das nicht, oder?","Doch, sehr!","On the contrary, very much!"]],
   ex:[["Hast du keine Zeit? — Doch, ich habe Zeit.","Do you have no time? — Yes, I do have time."]],
   tip:"Answering <i>ja</i> to a negative question is ambiguous in English and simply wrong in German. Use <b>doch</b>."}
 ],
 practice:[
  {type:"mc",q:"'Kommst du nicht mit?' — you ARE coming. Correct answer:",options:["Ja.","Doch.","Nein.","Schon."],a:1,ex:"doch contradicts the negative in the question."},
  {type:"fill",q:"Warte ___!",sub:"Wait a moment! (softening particle)",a:["mal"],ex:"mal turns a command into a casual request."},
  {type:"mc",q:"'Er ist wohl krank' means:",options:["He is definitely ill.","He is probably ill.","He wants to be ill.","He is well."],a:1,ex:"wohl expresses a supposition."},
  {type:"mc",q:"Which particle expresses resigned acceptance?",options:["doch","eben","denn","mal"],a:1,ex:"eben and its southern twin halt mean 'that's just how it is'."},
  {type:"order",q:"Build: Do come round some time!",words:["Komm","doch","mal","vorbei"],a:"Komm doch mal vorbei",ex:"Fixed particle order: doch before mal."},
  {type:"mc",q:"'Was machst du denn?' differs from 'Was machst du?' how?",options:["It is more formal","It sounds warmer and more interested","It is a past tense","It is a command"],a:1,ex:"denn in questions signals friendly curiosity or mild surprise."}
 ],
 checkpoint:[
  {type:"fill",q:"Das ist ___ toll!",sub:"That's great! — expressing pleasant surprise",a:["ja"],ex:"ja marks something as evident or surprising."},
  {type:"mc",q:"Correct particle order?",options:["mal doch ja","ja doch mal","doch ja mal","mal ja doch"],a:1,ex:"The conventional sequence is ja – doch – mal – eben."},
  {type:"mc",q:"Which sentence would sound cold without a particle?",options:["Setz dich hin!","Ich heiße Anna.","Berlin liegt im Osten.","Das Buch ist rot."],a:0,ex:"Imperatives without doch or mal sound brusque."},
  {type:"fill",q:"So ist es ___.",sub:"That's just how it is. (resignation)",a:["eben","halt"],ex:"eben in the north, halt in the south; both work."},
  {type:"mc",q:"Why are particles hard for learners?",options:["They change the case","They carry attitude, not content, and rarely translate","They are irregular verbs","They are only written, not spoken"],a:1,ex:"They encode speaker stance, which English conveys through intonation."}
 ],
 talk:{title:"Sound human",task:"Have a casual exchange and use at least five different modal particles. Ask your tutor to flag any that sound unnatural.",starter:"Sag mal, was machst du denn heute so? Erzähl doch mal!"}
},
{
 id:33, level:"C1", title:"Subjektive Modalverben", sub:"When modals express the speaker's judgement",
 goal:"Read the second meaning of modal verbs: certainty, rumour, and claims.",
 concepts:[
  {h:"Two readings of every modal",
   body:`<p>Beside their objective meaning (ability, obligation), modals have a subjective reading in which they express how sure the speaker is, or whose claim is being reported.</p>`,
   table:[["Modal","Objective","Subjective"],["müssen","obligation","near certainty: Er muss krank sein. — He must be ill."],["können","ability","possibility: Das kann stimmen. — That may be true."],["dürfte","permission","careful estimate: Das dürfte reichen. — That should be enough."],["mögen","liking","concession: Das mag sein. — That may well be."],["sollen","obligation","hearsay: Er soll reich sein. — He is said to be rich."],["wollen","wanting","a claim by the subject: Er will es nicht gewusst haben. — He claims not to have known."]],
   ex:[["Sie muss das Haus verkauft haben.","She must have sold the house."]],
   tip:"<b>sollen</b> = others say; <b>wollen</b> = he himself says. That contrast is heavily tested at C1."},
  {h:"Referring to the past",
   body:`<p>In the subjective reading, the past is formed with the modal plus a perfect infinitive: <span class="de">Partizip II + haben/sein</span>.</p>`,
   table:[["Sentence","Meaning"],["Er muss den Zug verpasst haben.","He must have missed the train."],["Sie kann schon gegangen sein.","She may already have left."],["Er soll das gesagt haben.","He is said to have said that."],["Sie will nichts gewusst haben.","She claims to have known nothing."]],
   ex:[["Der Täter soll geflohen sein.","The perpetrator is said to have fled."]],
   tip:"Objective past is different: <i>Er musste den Zug nehmen</i> (he had to). Subjective past always has a perfect infinitive at the end."},
  {h:"The certainty scale",
   body:`<p>German grades confidence finely. Learn the ladder from near-certain to remote.</p>`,
   table:[["Expression","Confidence"],["Er muss krank sein.","~95% — must be"],["Er dürfte krank sein.","~80% — probably"],["Er wird wohl krank sein.","~75% — presumably"],["Er kann krank sein.","~50% — may be"],["Er könnte krank sein.","~40% — could be"],["Er mag krank sein.","conceding the possibility"]],
   ex:[["Das dürfte kaum reichen.","That will hardly be enough."]],
   tip:"<b>dürfte</b> in this sense has nothing to do with permission. It is the polite estimator of educated German."}
 ],
 practice:[
  {type:"mc",q:"'Er soll reich sein' means:",options:["He should be rich.","He is said to be rich.","He wants to be rich.","He must become rich."],a:1,ex:"sollen in the subjective reading reports what others claim."},
  {type:"mc",q:"'Er will es nicht gewusst haben' means:",options:["He does not want to know it.","He claims not to have known it.","He should not have known it.","He may not have known it."],a:1,ex:"wollen reports the subject's own claim, usually with a hint of doubt."},
  {type:"fill",q:"Er ___ den Zug verpasst haben.",sub:"He must have missed the train.",a:["muss"],ex:"müssen plus a perfect infinitive expresses near certainty about the past."},
  {type:"mc",q:"Which expresses about 80% confidence?",options:["Er muss krank sein.","Er dürfte krank sein.","Er könnte krank sein.","Er mag krank sein."],a:1,ex:"dürfte is the standard educated estimate."},
  {type:"order",q:"Build: The perpetrator is said to have fled.",words:["Der","Täter","soll","geflohen","sein"],a:"Der Täter soll geflohen sein",ex:"soll + Partizip II + sein for reported past."}
 ],
 checkpoint:[
  {type:"mc",q:"What distinguishes sollen from wollen in the subjective reading?",options:["Tense","Whose claim it is","Politeness","Case"],a:1,ex:"sollen = others say it; wollen = the subject says it about himself."},
  {type:"fill",q:"Sie ___ schon gegangen sein.",sub:"She may already have left. (können)",a:["kann"],ex:"kann + perfect infinitive = possibility about the past."},
  {type:"mc",q:"'Das mag sein' means:",options:["I like that.","That may well be.","That must be.","That should be."],a:1,ex:"mögen concedes a possibility without endorsing it."},
  {type:"mc",q:"'Er musste den Zug nehmen' is which reading?",options:["subjective (certainty)","objective (obligation)","hearsay","a claim"],a:1,ex:"A plain Präteritum with no perfect infinitive is the objective meaning."},
  {type:"order",q:"Build: That will hardly be enough.",words:["Das","dürfte","kaum","reichen"],a:"Das dürfte kaum reichen",ex:"dürfte as a careful estimate, infinitive at the end."}
 ],
 talk:{title:"Speculate",task:"Speculate about a news story or a person, grading your certainty with muss, dürfte, könnte and soll.",starter:"Hallo! Stell dir vor, ein Nachbar ist plötzlich verschwunden. Was könnte passiert sein? Spekulieren Sie bitte."}
},
{
 id:34, level:"C1", title:"Komplexe Satzgefüge", sub:"Multi-clause architecture and the Satzklammer",
 goal:"Build and unpack long sentences without losing the verb.",
 concepts:[
  {h:"The bracket is the skeleton",
   body:`<p>Every German main clause is a bracket: the conjugated verb opens it in position 2, and everything heavy closes it at the end — separable prefix, infinitive, participle.</p>`,
   table:[["Opening","Middle field","Closing"],["Ich habe","ihm gestern das Buch","gegeben."],["Sie wird","den Vertrag morgen","unterschreiben."],["Er hat","die Prüfung nicht","bestehen können."],["Man muss","den Antrag bis Freitag","eingereicht haben."]],
   ex:[["Wir hätten das Problem längst lösen können.","We could have solved the problem long ago."]],
   tip:"When two infinitives meet a modal in a perfect tense, you get the <b>Ersatzinfinitiv</b>: <i>hat … bestehen können</i>, not <i>gekonnt</i>."},
  {h:"Order inside the middle field",
   body:`<p>The middle field is not free. Default tendencies: pronouns before nouns, known before new, dative before accusative with nouns, accusative before dative with pronouns.</p>`,
   table:[["Rule","Example"],["Two nouns: dative first","Ich gebe dem Kind das Buch."],["Two pronouns: accusative first","Ich gebe es ihm."],["Pronoun before noun","Ich gebe es dem Kind."],["nicht before the closing bracket","Ich habe ihn gestern nicht gesehen."],["Time – manner – place","Er fährt morgen mit dem Auto nach Bonn."]],
   ex:[["Ich habe es ihr gestern nicht erklären können.","I could not explain it to her yesterday."]],
   tip:"<b>Es ihm</b>, never <i>ihm es</i>. Pronoun clusters are rigid even where nouns are flexible."},
  {h:"Nesting clauses",
   body:`<p>A subordinate clause can contain another. The verbs pile up at the end in reverse order of their clauses, which is what makes long German sentences feel like a puzzle.</p>`,
   table:[["Sentence","Structure"],["Ich weiß, dass er sagte, dass er kommen werde.","main – dass – dass"],["Da er, obwohl er müde war, weiterarbeitete, …","clause inside a clause"],["Er sagte, er habe nicht gewusst, dass sie krank gewesen sei.","reported speech nested"]],
   ex:[["Weil der Antrag, den wir gestern eingereicht haben, unvollständig war, wurde er abgelehnt.","Because the application we submitted yesterday was incomplete, it was rejected."]],
   tip:"To parse one: find the finite verb of each clause, working from the outside in. Commas mark every boundary, which is why German punctuation is grammatical rather than rhetorical."}
 ],
 practice:[
  {type:"mc",q:"'Er hat die Prüfung nicht bestehen ___.'",options:["gekonnt","können","konnte","gekonnt haben"],a:1,ex:"Ersatzinfinitiv: a modal with a dependent infinitive appears as an infinitive, not a participle."},
  {type:"mc",q:"Two pronoun objects — which order?",options:["Ich gebe ihm es.","Ich gebe es ihm.","Ich gebe ihm's nicht.","Both are equal."],a:1,ex:"With two pronouns the accusative comes first."},
  {type:"order",q:"Build: I gave the child the book yesterday.",words:["Ich","habe","dem","Kind","gestern","das","Buch","gegeben"],a:"Ich habe dem Kind gestern das Buch gegeben",ex:"Dative noun before accusative noun; participle closes the bracket."},
  {type:"mc",q:"Where does nicht usually stand?",options:["First in the sentence","Directly after the subject","Just before the closing bracket","At the very end always"],a:2,ex:"nicht precedes the element it negates and typically sits before the participle or infinitive."},
  {type:"fill",q:"Wir hätten das Problem längst lösen ___.",sub:"…could have solved (können)",a:["können","koennen"],ex:"Double infinitive at the end: lösen können."}
 ],
 checkpoint:[
  {type:"mc",q:"What closes the Satzklammer?",options:["The subject","The finite verb","The infinitive, participle or separable prefix","The object"],a:2,ex:"Position 2 opens, the heavy verbal material closes."},
  {type:"order",q:"Build: I could not explain it to her yesterday.",words:["Ich","habe","es","ihr","gestern","nicht","erklären","können"],a:"Ich habe es ihr gestern nicht erklären können",ex:"Pronouns first (acc before dat), nicht before the double infinitive."},
  {type:"mc",q:"'Ich gebe es dem Kind' — why this order?",options:["Accusative always first","A pronoun precedes a noun","Dative always last","It is wrong"],a:1,ex:"Pronouns move left ahead of full noun phrases."},
  {type:"mc",q:"German commas are:",options:["stylistic, marking pauses","grammatical, marking clause boundaries","optional","used only in lists"],a:1,ex:"They mark structure, which is what makes nested sentences readable."},
  {type:"order",q:"Build: He will sign the contract tomorrow.",words:["Er","wird","den","Vertrag","morgen","unterschreiben"],a:"Er wird den Vertrag morgen unterschreiben",ex:"wird opens the bracket, the infinitive closes it."}
 ],
 talk:{title:"Build long sentences",task:"Produce three deliberately long sentences with nested clauses and ask your tutor to check the verb positions.",starter:"Hallo! Bilden Sie bitte einen möglichst langen, aber korrekten Satz mit mindestens zwei Nebensätzen."}
},
{
 id:35, level:"C1", title:"Register und Idiomatik", sub:"Collocations, idioms and text cohesion",
 goal:"Match your language to the situation and use idioms without sounding like a textbook.",
 concepts:[
  {h:"Four registers",
   body:`<p>The same idea shifts form dramatically across registers. C1 means controlling all four.</p>`,
   table:[["Register","Example of 'I cannot come'"],["Umgangssprachlich","Ich schaff's nicht."],["Neutral","Ich kann leider nicht kommen."],["Gehoben","Es ist mir leider nicht möglich zu kommen."],["Amtlich","Eine Teilnahme ist mir leider nicht möglich."]],
   ex:[["Wir bedauern, Ihnen mitteilen zu müssen, dass …","We regret to have to inform you that …"]],
   tip:"Mixing registers is the giveaway: <i>Hiermit teile ich dir mit, dass ich keinen Bock habe</i> is comic, not casual."},
  {h:"Idioms worth owning",
   body:`<p>These appear constantly in speech and press. Each is fixed: the words cannot be swapped.</p>`,
   table:[["Idiom","Literal","Meaning"],["die Daumen drücken","press the thumbs","to keep fingers crossed"],["auf dem Schlauch stehen","stand on the hose","to not get it"],["etwas auf die lange Bank schieben","push onto the long bench","to procrastinate"],["ins Fettnäpfchen treten","step in the little fat bowl","to put one's foot in it"],["den Nagel auf den Kopf treffen","hit the nail on the head","to be exactly right"],["unter vier Augen","under four eyes","in private"]],
   ex:[["Ich drücke dir die Daumen!","I'll keep my fingers crossed for you!"]],
   tip:"Use one or two idioms per conversation. A string of them sounds like a phrasebook."},
  {h:"Cohesion: making a text hold together",
   body:`<p>Beyond connectors, German binds text with pronouns, <span class="de">da-</span> compounds, and deliberate repetition of key nouns in varied form.</p>`,
   table:[["Device","Example"],["Reference with dies-","Die Studie erschien 2019. Diese zeigt, dass …"],["da- compounds","Wir sprachen über die Kosten. Dabei wurde deutlich, dass …"],["Synonym variation","der Antrag → das Gesuch → das Schreiben"],["Summarising noun","Er kam zu spät und ging früh. Dieses Verhalten …"]],
   ex:[["Die Zahlen stiegen stark. Dies führte zu einer Debatte.","The figures rose sharply. This led to a debate."]],
   tip:"The <b>summarising noun</b> (<i>dieses Verhalten, diese Entwicklung, dieser Umstand</i>) is the single most useful cohesion device in formal German."}
 ],
 practice:[
  {type:"mc",q:"'auf dem Schlauch stehen' means:",options:["to be in the way","to not understand something","to wait patiently","to be under pressure"],a:1,ex:"It describes a temporary mental blank."},
  {type:"fill",q:"Ich drücke dir die ___!",sub:"I'll keep my fingers crossed!",a:["daumen"],ex:"Germans press thumbs rather than crossing fingers."},
  {type:"mc",q:"Which is gehobener Stil?",options:["Ich schaff's nicht.","Ich kann nicht kommen.","Es ist mir leider nicht möglich zu kommen.","Geht nicht."],a:2,ex:"Elevated register replaces the modal with an impersonal construction."},
  {type:"mc",q:"'etwas auf die lange Bank schieben' means:",options:["to sit down","to procrastinate","to share something","to reject something"],a:1,ex:"To keep postponing a task."},
  {type:"fill",q:"Die Zahlen stiegen stark. ___ führte zu einer Debatte.",sub:"This led to a debate. (reference word)",a:["dies","das"],ex:"dies refers back to the whole preceding statement."}
 ],
 checkpoint:[
  {type:"mc",q:"'unter vier Augen' means:",options:["face to face in private","in a crowd","with witnesses","in writing"],a:0,ex:"A conversation between exactly two people."},
  {type:"mc",q:"What is a summarising noun used for?",options:["To start a text","To refer back to a whole preceding idea","To ask a question","To mark the past"],a:1,ex:"dieses Verhalten, diese Entwicklung: they compress a previous sentence into a noun phrase."},
  {type:"fill",q:"Du hast den Nagel auf den ___ getroffen.",sub:"You hit the nail on the head.",a:["kopf"],ex:"The idiom matches English exactly here, which is rare."},
  {type:"mc",q:"Which sentence mixes registers badly?",options:["Sehr geehrte Damen und Herren, hiermit kündige ich …","Hiermit teile ich Ihnen mit, dass ich keinen Bock habe.","Hallo Tom, ich komme leider nicht.","Es ist mir nicht möglich teilzunehmen."],a:1,ex:"A formal opening with slang collapses the register."},
  {type:"mc",q:"'ins Fettnäpfchen treten' means:",options:["to get rich","to say something embarrassing","to cook badly","to slip on ice"],a:1,ex:"To commit a social gaffe."}
 ],
 talk:{title:"Shift register",task:"Say the same message three times: to a friend, to a colleague, and in a formal letter. Then use two idioms naturally.",starter:"Hallo! Formulieren Sie bitte eine Absage — einmal locker an einen Freund, einmal förmlich an eine Behörde."}
},
{
 id:36, level:"C2", title:"Informationsstruktur", sub:"Vorfeld, focus and emphasis",
 goal:"Control what a German sentence foregrounds, not just whether it is correct.",
 concepts:[
  {h:"The Vorfeld is a choice",
   body:`<p>Exactly one element may precede the finite verb. Which one you choose determines the topic and the flow of a text — it is not stylistic decoration.</p>`,
   table:[["Vorfeld","Effect"],["Ich habe gestern das Buch gelesen.","neutral, subject as topic"],["Gestern habe ich das Buch gelesen.","time as the frame; contrasts with other days"],["Das Buch habe ich gestern gelesen.","the book as topic; contrasts with other books"],["Gelesen habe ich das Buch.","contrast on the action itself: read it, yes — understood, no"]],
   ex:[["Diesen Vorschlag halte ich für gefährlich.","This proposal I consider dangerous."]],
   tip:"Fronting the object is normal and elegant in German, not marked or poetic as in English."},
  {h:"The end field carries the news",
   body:`<p>German tends to place given information early and new information late, just before the closing bracket. The strongest focus position is the last stressed element.</p>`,
   table:[["Sentence","New information"],["Ich habe dem Kind das BUCH gegeben.","what was given"],["Ich habe das Buch dem KIND gegeben.","who received it"],["Es wurde nur EINE Frage gestellt.","the number"]],
   ex:[["Über dieses Thema wurde lange diskutiert.","This topic was discussed at length."]],
   tip:"When a learner's German is correct but the emphasis is wrong, the cause is nearly always a misplaced new element."},
  {h:"Es as a placeholder",
   body:`<p><span class="de">es</span> has several distinct jobs at C2 level, and only one of them is a real pronoun.</p>`,
   table:[["Use","Example","Note"],["Real subject","Das Buch? Es liegt dort.","refers to a neuter noun"],["Weather / impersonal","Es regnet. Es geht mir gut.","no referent at all"],["Vorfeld placeholder","Es kam ein Mann herein.","disappears if anything else fronts: Herein kam ein Mann."],["Anticipating a clause","Es ist wichtig, dass du kommst.","points forward to the dass-clause"]],
   ex:[["Es wurde viel geredet, aber wenig entschieden.","There was much talk but little decision."]],
   tip:"The placeholder <b>es</b> exists only to fill the Vorfeld. Front anything else and it vanishes — proof that it is not a subject."}
 ],
 practice:[
  {type:"mc",q:"'Das Buch habe ich gestern gelesen' emphasises:",options:["the time","the book as topic","the subject","the verb"],a:1,ex:"Fronting the object makes it the topic, often in contrast to something else."},
  {type:"mc",q:"How many elements may precede the finite verb in a main clause?",options:["None","Exactly one","Two","Any number"],a:1,ex:"The Vorfeld holds exactly one constituent — that is what verb-second means."},
  {type:"mc",q:"In 'Es kam ein Mann herein', es is:",options:["the subject","a placeholder in the Vorfeld","a pronoun for Mann","an error"],a:1,ex:"The real subject is ein Mann; es only fills the front slot."},
  {type:"order",q:"Build (fronting the object): This proposal I consider dangerous.",words:["Diesen","Vorschlag","halte","ich","für","gefährlich"],a:"Diesen Vorschlag halte ich für gefährlich",ex:"Accusative object in the Vorfeld, verb second, subject third."},
  {type:"mc",q:"Where does new information usually sit?",options:["In the Vorfeld","Late, before the closing bracket","Right after the verb","It does not matter"],a:1,ex:"Given before new is the default information flow."}
 ],
 checkpoint:[
  {type:"mc",q:"'Herein kam ein Mann' — what happened to es?",options:["It was deleted by mistake","It vanished because something else fills the Vorfeld","It moved to the end","It became ihn"],a:1,ex:"The placeholder exists only for the front slot."},
  {type:"mc",q:"Fronting an object in German is:",options:["poetic and rare","normal and used for topicalisation","ungrammatical","only possible in questions"],a:1,ex:"Unlike English, German fronts objects routinely."},
  {type:"order",q:"Build: This topic was discussed at length.",words:["Über","dieses","Thema","wurde","lange","diskutiert"],a:"Über dieses Thema wurde lange diskutiert",ex:"A prepositional phrase occupies the Vorfeld of an impersonal passive."},
  {type:"mc",q:"'Es ist wichtig, dass du kommst' — the es here:",options:["is the real subject","anticipates the dass-clause","means the weather","is optional slang"],a:1,ex:"The dass-clause is the logical subject; es holds its place."},
  {type:"mc",q:"A learner's German is grammatical but the emphasis feels wrong. Most likely cause?",options:["Wrong case","New information placed too early","Missing commas","Wrong gender"],a:1,ex:"Information structure, not morphology, is the usual culprit at advanced level."}
 ],
 talk:{title:"Control emphasis",task:"Say one fact four different ways, changing what stands in the Vorfeld each time, and explain in German what shifts.",starter:"Hallo! Nehmen Sie einen einfachen Satz und variieren Sie das Vorfeld. Was ändert sich jeweils an der Betonung?"}
},
{
 id:37, level:"C2", title:"Irreale Feinheiten", sub:"als ob, hätte…sollen, mixed conditionals",
 goal:"Handle the full range of unreal constructions with precision.",
 concepts:[
  {h:"Unreal comparisons",
   body:`<p><span class="de">als ob</span> and <span class="de">als wenn</span> send the verb to the end; bare <span class="de">als</span> puts the verb immediately after it. Konjunktiv II is standard in careful German.</p>`,
   table:[["Structure","Example"],["als ob + verb last","Er tut so, als ob er alles wüsste."],["als + verb second","Er tut so, als wüsste er alles."],["past","Er sah aus, als hätte er nicht geschlafen."],["indicative (colloquial)","Er tut so, als ob er alles weiß."]],
   ex:[["Sie sprach, als wäre nichts geschehen.","She spoke as if nothing had happened."]],
   tip:"The bare <b>als</b> version with the verb immediately following is the more elegant and the more common in writing."},
  {h:"Regret and reproach",
   body:`<p>To say what should have happened, combine Konjunktiv II of the modal with a perfect infinitive.</p>`,
   table:[["Structure","Meaning"],["Ich hätte früher kommen sollen.","I should have come earlier."],["Du hättest fragen können.","You could have asked."],["Das hättest du nicht tun dürfen.","You should not have been allowed to do that."],["Er hätte es wissen müssen.","He ought to have known."]],
   ex:[["Wir hätten uns das denken können.","We might have guessed."]],
   tip:"The pattern is always <b>hätte + Infinitiv + Modalinfinitiv</b>. The modal never appears as a participle here."},
  {h:"Mixed and elliptical conditionals",
   body:`<p>Real German mixes time frames and drops elements freely — a C2 reader must reconstruct them.</p>`,
   table:[["Sentence","Reading"],["Wenn ich damals gelernt hätte, wäre ich jetzt Arzt.","past condition, present result"],["Sollte es regnen, bleiben wir zu Hause.","sollte = in the event that; formal, verb-first"],["Angenommen, es klappt nicht — was dann?","hypothetical framed with a participle"],["Wäre ich du, ich würde schweigen.","wenn dropped, verb first"]],
   ex:[["Ohne deine Hilfe hätte ich das nie geschafft.","Without your help I would never have managed it."]],
   tip:"<b>ohne … hätte</b> and <b>andernfalls</b> hide a whole conditional inside a phrase. Recognising these is a C2 reading skill."}
 ],

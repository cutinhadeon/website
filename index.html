<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>getDeutsched — German from A1 to C2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdfcf4; --panel:#ffffff; --panel-2:#fff4b8; --ink:#0e0e0c; --ink-soft:#4c4a3f;
  --line:#ece4a0; --accent:#f2c200; --accent-soft:#fff2ad; --good:#1f7a3d; --good-soft:#dff2e4;
  --bad:#c22a2a; --bad-soft:#fbe3e3; --gold:#0e0e0c; --gold-soft:#f7e98f;
  --on-accent:#0e0e0c; --on-gold:#ffffff;
  --shadow:0 1px 2px rgba(20,18,0,.08),0 8px 24px rgba(20,18,0,.08);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0a08; --panel:#141310; --panel-2:#1f1c0c; --ink:#f7f4e4; --ink-soft:#b7b29a;
    --line:#332e10; --accent:#ffd400; --accent-soft:#3a3106; --good:#7fc396; --good-soft:#1e2f22;
    --bad:#e98a8a; --bad-soft:#331d1d; --gold:#ffffff; --gold-soft:#232323;
    --on-accent:#0e0e0c; --on-gold:#0e0e0c;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0a08; --panel:#141310; --panel-2:#1f1c0c; --ink:#f7f4e4; --ink-soft:#b7b29a;
  --line:#332e10; --accent:#ffd400; --accent-soft:#3a3106; --good:#7fc396; --good-soft:#1e2f22;
  --bad:#e98a8a; --bad-soft:#331d1d; --gold:#ffffff; --gold-soft:#232323;
  --on-accent:#0e0e0c; --on-gold:#0e0e0c;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
a{color:var(--accent)}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.01em}
.logo span{color:var(--accent)}
.tagline{color:var(--ink-soft);font-size:13px}
.spacer{flex:1}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500}
.ghost:hover{background:var(--panel-2)}
.layout{display:grid;grid-template-columns:288px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto}
@media (max-width:900px){aside{position:static;max-height:none}}
.side-h{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:2px 0 10px}
.lvl{width:100%;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:10px 0 6px;font-weight:700;font-size:13px}
.lvl .cef{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 7px;font-size:11px;letter-spacing:.06em}
.lvl .pc{margin-left:auto;font-weight:500;color:var(--ink-soft);font-size:12px}
.unit-btn{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:11px;padding:8px;margin-bottom:2px}
.unit-btn:hover:not(:disabled){background:var(--panel-2)}
.unit-btn.active{background:var(--accent-soft);border-color:var(--accent)}
.unit-btn:disabled{opacity:.4;cursor:not-allowed}
.num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700}
.unit-btn.done .num{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.unit-btn .t{font-size:13.5px;font-weight:600;line-height:1.3}
.unit-btn .s{font-size:11.5px;color:var(--ink-soft);line-height:1.3}
.unit-btn.gaunt{border-color:var(--gold);background:var(--gold-soft)}
.unit-btn.gaunt .num{background:transparent;border-color:var(--gold);color:var(--gold)}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
@media (max-width:520px){.card{padding:15px}.wrap{padding:11px}}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.stage{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.stage.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage.ok{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.stage:disabled{opacity:.45;cursor:not-allowed}
.concept{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.concept:first-of-type{border-top:0;margin-top:6px}
.concept h3{font-size:21px;margin-bottom:6px}
.concept p{margin:8px 0}
table.g{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
table.g th,table.g td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.g th{background:var(--panel-2);font-weight:600;font-size:13px}
.de{font-weight:600}
.exlist{list-style:none;padding:0;margin:12px 0}
.exlist li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--panel-2);margin-bottom:6px}
.exlist .txt{flex:1}
.exlist .en{color:var(--ink-soft);font-size:14px}
.spk{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:14px}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.tip{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0;font-size:15px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:11px;padding:11px 18px;font-weight:700;font-size:15px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--panel-2);filter:none}
.btn.gold{background:var(--gold);color:var(--on-gold);border:1px solid var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.prog{height:7px;background:var(--panel-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--ink-soft);margin-bottom:12px;font-weight:600;flex-wrap:wrap}
.qtext{font-size:19px;font-family:var(--serif);font-weight:500;margin:10px 0 4px;line-height:1.4}
.qsub{color:var(--ink-soft);font-size:14px;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
input.txt{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;color:var(--ink);font-family:var(--sans)}
input.txt:focus{outline:0;border-color:var(--accent)}
.umlauts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.umlauts button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:5px 11px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:var(--panel-2);margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:16px}
.chip:hover{border-color:var(--accent)}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px;white-space:pre-wrap}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.neutral{background:var(--panel-2);border:1px solid var(--line)}
.fb b{font-family:var(--serif)}
.chat{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);padding:12px;max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{flex:1}
.mini{font-size:13px;color:var(--ink-soft)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.badge.gold{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
.score{font-family:var(--serif);font-size:46px;font-weight:700}
.center{text-align:center}
.overflowx{overflow-x:auto}
.hidden{display:none !important}
/* pronunciation */
.pron-target{font-family:var(--serif);font-size:24px;line-height:1.5;margin:10px 0 14px}
.pw{display:inline-block;margin:0 4px 4px 0;padding:2px 6px;border-radius:7px;border:1px solid transparent}
.pw.good{background:var(--good-soft);border-color:var(--good)}
.pw.near{background:var(--gold-soft);border-color:var(--gold)}
.pw.bad{background:var(--bad-soft);border-color:var(--bad)}
.meter{height:12px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;transition:width .4s ease}
.bigscore{font-family:var(--serif);font-size:54px;font-weight:700;line-height:1}
.pill{display:inline-block;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;margin:0 6px 6px 0}
.rec{background:var(--bad);color:#fff}
/* explain tool */
#selBtn{position:absolute;z-index:60;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow);display:none}
#drawer{position:fixed;right:0;bottom:0;top:0;width:420px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .28s ease;z-index:70;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
#drawer .body{padding:16px;overflow-y:auto;flex:1;font-size:15px;white-space:pre-wrap}
#drawer .quote{background:var(--accent-soft);border-left:3px solid var(--accent);padding:9px 12px;border-radius:0 10px 10px 0;margin-bottom:14px;font-family:var(--serif);font-size:16px;white-space:normal}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <div class="logo">get<span>Deutsch</span>ed</div>
    <div class="tagline">A1 to C2 — 40 modules, 8 gauntlet exams, pronunciation scoring and a live tutor</div>
  </div>
  <div class="spacer"></div>
  <button class="ghost" id="labBtn">🎤 Pronunciation lab</button>
  <button class="ghost" id="themeBtn">◐ Theme</button>
  <button class="ghost" id="resetBtn">↺ Reset</button>
</header>

<div class="layout">
  <aside>
    <div class="side-h">Your path</div>
    <div id="unitList"></div>
    <div style="margin-top:14px">
      <div class="mini" id="overallTxt"></div>
      <div class="prog" style="margin-top:6px"><i id="overallBar" style="width:0%"></i></div>
    </div>
  </aside>
  <main>
    <div id="head"></div>
    <div id="stageArea"></div>
  </main>
</div>
</div>
<button id="selBtn">✦ Explain this</button>
<div id="drawer">
  <header>
    <b style="font-family:var(--serif);font-size:17px">Grammar explainer</b>
    <div class="spacer" style="flex:1"></div>
    <button class="ghost" id="drawerClose">Close</button>
  </header>
  <div class="body" id="drawerBody"></div>
</div>
<script>
const UNITS_A = [
{
 id:1, title:"Hallo! Ich bin…", sub:"Greetings, pronouns, and the verb sein",
 goal:"Greet someone, say your name and where you are from, and use ich / du / Sie correctly.",
 concepts:[
  {h:"Greetings depend on the time of day",
   body:`<p>German greetings are not interchangeable. Pick by the clock, and by how formal the situation is.</p>`,
   table:[["German","English","When"],
          ["Guten Morgen","Good morning","until ~11:00"],
          ["Guten Tag","Good day / hello","~11:00 to evening — safe and neutral"],
          ["Guten Abend","Good evening","from ~18:00"],
          ["Hallo","Hi","any time, casual, very common"],
          ["Tschüss","Bye","casual goodbye"],
          ["Auf Wiedersehen","Goodbye","formal goodbye"]],
   ex:[["Guten Morgen, Frau Schmidt!","Good morning, Ms. Schmidt!"],
       ["Hallo! Wie geht's?","Hi! How are you?"],
       ["Tschüss, bis morgen!","Bye, see you tomorrow!"]],
   tip:"<b>Gute Nacht</b> is not a greeting — it means good night as in <i>I am going to bed</i>."},
  {h:"du or Sie — you must choose",
   body:`<p>English has one <span class="de">you</span>. German has two, and picking the wrong one is the most visible beginner mistake.</p>
   <p><span class="de">du</span> = one person you are close to: friends, family, children, classmates, most people under about 30 in casual settings.<br>
   <span class="de">Sie</span> = a stranger, an official, a shop clerk, a boss, anyone older you do not know. Always written with a capital S.</p>`,
   table:[["Casual (du)","Formal (Sie)","English"],
          ["Wie heißt du?","Wie heißen Sie?","What is your name?"],
          ["Wie geht es dir?","Wie geht es Ihnen?","How are you?"],
          ["Woher kommst du?","Woher kommen Sie?","Where are you from?"]],
   ex:[["Wie heißen Sie, bitte?","What is your name, please?"],
       ["Ich heiße Anna. Und du?","My name is Anna. And you?"]],
   tip:"When in doubt, use <b>Sie</b>. Being too formal is polite; being too casual is rude."},
  {h:"Personal pronouns",
   body:`<p>These are the subject pronouns — the person doing the action.</p>`,
   table:[["German","English","Note"],
          ["ich","I","never capitalised mid-sentence"],
          ["du","you (one person, casual)",""],
          ["er / sie / es","he / she / it",""],
          ["wir","we",""],
          ["ihr","you (several people, casual)",""],
          ["sie","they",""],
          ["Sie","you (formal)","capital S always"]],
   ex:[["Wir kommen aus Berlin.","We come from Berlin."],
       ["Sie ist Lehrerin.","She is a teacher."]],
   tip:"<b>sie</b> can mean <i>she</i>, <i>they</i> or (capitalised) <i>you formal</i>. The verb ending tells you which: <i>sie ist</i> = she is, <i>sie sind</i> = they are."},
  {h:"sein — to be",
   body:`<p>The single most used verb in German, and completely irregular. Memorise the whole table.</p>`,
   table:[["Pronoun","Form","Example"],
          ["ich","bin","Ich bin müde. — I am tired."],
          ["du","bist","Du bist nett. — You are nice."],
          ["er / sie / es","ist","Er ist Student. — He is a student."],
          ["wir","sind","Wir sind hier. — We are here."],
          ["ihr","seid","Ihr seid spät. — You are late."],
          ["sie / Sie","sind","Sie sind Deutsche. — They are German."]],
   ex:[["Ich bin Anna und ich bin aus Spanien.","I am Anna and I am from Spain."],
       ["Bist du müde?","Are you tired?"]],
   tip:"No <i>a / an</i> before a job: <b>Ich bin Lehrer</b>, not <i>ich bin ein Lehrer</i>."},
  {h:"Introducing yourself",
   body:`<p>Three building blocks cover almost every introduction.</p>`,
   table:[["Pattern","Example","English"],
          ["Ich heiße …","Ich heiße Ben.","My name is Ben."],
          ["Ich komme aus …","Ich komme aus Italien.","I come from Italy."],
          ["Ich wohne in …","Ich wohne in Berlin.","I live in Berlin."]],
   ex:[["Hallo, ich heiße Mia. Ich komme aus Polen und wohne in Hamburg.","Hi, my name is Mia. I come from Poland and live in Hamburg."],
       ["Freut mich!","Nice to meet you!"]],
   tip:"<b>heißen</b> literally means <i>to be called</i>, so you never translate it word for word."}
 ],
 practice:[
  {type:"mc",q:"It is 8 in the morning. You walk into the bakery. What do you say?",options:["Guten Abend","Guten Morgen","Gute Nacht","Auf Wiedersehen"],a:1,ex:"Guten Morgen is used until roughly 11 a.m. Gute Nacht is only for going to bed."},
  {type:"fill",q:"Ich ___ Anna.",sub:"My name is Anna.",a:["heiße","heisse"],ex:"heißen conjugates ich heiße, du heißt, er heißt. If you cannot type ß, 'heisse' is a valid spelling."},
  {type:"mc",q:"You are meeting your new boss. How do you ask her name?",options:["Wie heißt du?","Wie heißen Sie?","Wer bist du?","Wie geht's?"],a:1,ex:"A boss you do not know gets Sie. Note the verb ending -en that goes with Sie."},
  {type:"fill",q:"Wir ___ aus Deutschland.",sub:"We are from Germany.",a:["sind"],ex:"wir sind. The same form is used for sie (they) and Sie (you formal)."},
  {type:"order",q:"Build: I come from Italy.",words:["Ich","komme","aus","Italien"],a:"Ich komme aus Italien",ex:"Subject, then verb, then the rest. 'aus' is the standard word for from + a country."},
  {type:"listen",say:"Ich bin müde.",q:"What did you hear?",options:["I am tired.","I am hungry.","I am here.","I am late."],a:0,ex:"müde = tired. Press play as many times as you like."},
  {type:"mc",q:"Which sentence is correct German?",options:["Ich bin ein Lehrer.","Ich bin Lehrer.","Ich bin der Lehrer aus.","Ich ist Lehrer."],a:1,ex:"With professions German drops the article: Ich bin Lehrer / Ärztin / Student."}
 ],
 checkpoint:[
  {type:"fill",q:"Du ___ sehr nett.",sub:"You are very nice.",a:["bist"],ex:"du bist — the du form of sein."},
  {type:"mc",q:"Which greeting is formal?",options:["Tschüss","Hallo","Auf Wiedersehen","Hi"],a:2,ex:"Auf Wiedersehen is the formal goodbye; Tschüss is casual."},
  {type:"order",q:"Build: I live in Berlin.",words:["Ich","wohne","in","Berlin"],a:"Ich wohne in Berlin",ex:"wohnen in + city."},
  {type:"mc",q:"'Ihr ___ spät.' Which form fits?",options:["seid","sind","seit","bist"],a:0,ex:"ihr seid. Careful: 'seit' with a t means 'since' and is a different word."},
  {type:"fill",q:"Ich ___ aus Japan.",sub:"I come from Japan.",a:["komme"],ex:"kommen: ich komme, du kommst, er kommt."},
  {type:"listen",say:"Wie heißen Sie?",q:"Was this question formal or casual?",options:["Formal","Casual"],a:0,ex:"heißen + Sie signals the formal form."}
 ],
 talk:{title:"Introduce yourself",task:"Greet your tutor, say your name, where you are from and where you live. Then ask them the same thing.",
       starter:"Guten Tag! Ich heiße Herr Weber. Wie heißen Sie?"}
},
{
 id:2, title:"Der, die, das", sub:"Nouns, gender and articles",
 goal:"Know why every German noun carries a gender, and learn the clues that predict it.",
 concepts:[
  {h:"Every noun is capitalised",
   body:`<p>Nouns are written with a capital letter anywhere in the sentence: <span class="de">der Hund</span>, <span class="de">die Stadt</span>, <span class="de">das Buch</span>. This is not optional — it is a spelling rule, and it makes reading much easier once you get used to it.</p>`,
   ex:[["Ich lese ein Buch.","I am reading a book."],
       ["Die Stadt ist schön.","The city is beautiful."]]},
  {h:"Three genders, one word for 'the'… sort of",
   body:`<p>German has three grammatical genders. Gender is a property of the <i>word</i>, not of the thing — <span class="de">das Mädchen</span> (the girl) is neuter.</p>`,
   table:[["Gender","the","a","Example"],
          ["masculine","der","ein","der Tisch — the table"],
          ["feminine","die","eine","die Lampe — the lamp"],
          ["neuter","das","ein","das Fenster — the window"],
          ["plural","die","— (use kein / meine)","die Bücher — the books"]],
   ex:[["Der Tisch ist groß.","The table is big."],
       ["Das ist eine Lampe.","That is a lamp."]],
   tip:"Learn every new noun <b>with its article</b>. Not <i>Tisch</i> but <i>der Tisch</i>. This is the single highest-value habit in beginner German."},
  {h:"Endings that give the gender away",
   body:`<p>You cannot always guess, but about half of all nouns follow a reliable ending pattern.</p>`,
   table:[["Ending","Gender","Examples"],
          ["-ung, -heit, -keit, -schaft, -ion, -tät","die","die Zeitung, die Freiheit, die Universität"],
          ["-chen, -lein, -um, -ment","das","das Mädchen, das Zentrum, das Dokument"],
          ["-er (person doing something), -ling","der","der Lehrer, der Schmetterling"],
          ["-e (very often, not always)","die","die Lampe, die Blume — but der Name"]],
   ex:[["Die Zeitung ist neu.","The newspaper is new."],
       ["Das Mädchen heißt Lena.","The girl is called Lena."]],
   tip:"<b>-chen</b> makes anything neuter, even people. That is why <i>das Mädchen</i> is neuter."},
  {h:"das ist / das sind — pointing at things",
   body:`<p>To point something out, use <span class="de">das ist</span> regardless of the noun's gender, and <span class="de">das sind</span> for plurals.</p>`,
   table:[["German","English"],
          ["Das ist ein Stuhl.","That is a chair."],
          ["Das ist eine Tür.","That is a door."],
          ["Das sind Bücher.","Those are books."]],
   ex:[["Was ist das? — Das ist ein Fenster.","What is that? — That is a window."]],
   tip:"Here <b>das</b> is a pointer word, not the neuter article, so it never changes to der or die."}
 ],
 practice:[

  {type:"mc",q:"Which article goes with Mädchen?",options:["der","die","das"],a:2,ex:"The ending -chen always makes a noun neuter, even when it refers to a person."},
  {type:"fill",q:"___ Tisch ist groß.",sub:"The table is big. (Tisch is masculine)",a:["der"],ex:"Masculine nouns take der as the subject."},
  {type:"mc",q:"Which sentence is written correctly?",options:["Ich lese ein buch.","ich lese ein Buch.","Ich lese ein Buch.","Ich Lese ein Buch."],a:2,ex:"Sentence starts with a capital, the noun Buch is capitalised, the verb is not."},
  {type:"fill",q:"Das ist ___ Lampe.",sub:"That is a lamp. (Lampe is feminine)",a:["eine"],ex:"Feminine indefinite article = eine."},
  {type:"mc",q:"Which is the best way to learn a new noun?",options:["Just the noun","The noun with its article","The noun in plural only","The noun with a translation only"],a:1,ex:"Store der/die/das together with the word from day one — the gender is unpredictable later."},
  {type:"listen",say:"Das sind Bücher.",q:"How many things are being pointed at?",options:["One","More than one"],a:1,ex:"das sind + plural noun. Bücher is the plural of Buch."}
 ],

 ],

{
 id:3, title:"Verben im Präsens", sub:"Present tense, questions, and word order",
 goal:"Conjugate regular verbs, handle the tricky stem-changing ones, and ask questions.",
 concepts:[
  {h:"Regular verb endings",
   body:`<p>Take the infinitive (<span class="de">wohnen</span>), cut off <span class="de">-en</span> to get the stem (<span class="de">wohn-</span>), and add the ending.</p>`,
   table:[["Pronoun","Ending","wohnen","spielen"],
          ["ich","-e","wohne","spiele"],
          ["du","-st","wohnst","spielst"],
          ["er/sie/es","-t","wohnt","spielt"],
          ["wir","-en","wohnen","spielen"],
          ["ihr","-t","wohnt","spielt"],
          ["sie/Sie","-en","wohnen","spielen"]],
   ex:[["Ich spiele Fußball.","I play football."],
       ["Wir wohnen in Köln.","We live in Cologne."]],
   tip:"German present tense covers both <i>I play</i> and <i>I am playing</i>. There is no separate continuous form."},
  {h:"haben — to have",
   body:`<p>The second essential irregular verb after <span class="de">sein</span>.</p>`,
   table:[["Pronoun","Form"],["ich","habe"],["du","hast"],["er/sie/es","hat"],["wir","haben"],["ihr","habt"],["sie/Sie","haben"]],
   ex:[["Ich habe Zeit.","I have time."],["Hast du Hunger?","Are you hungry?"]],
   tip:"German says <b>Ich habe Hunger</b> — literally <i>I have hunger</i>, not <i>I am hungry</i>."},
  {h:"Stem-changing verbs",
   body:`<p>A small but very common group changes its vowel in the <span class="de">du</span> and <span class="de">er/sie/es</span> forms only. Everything else stays regular.</p>`,
   table:[["Infinitive","du","er/sie/es","Change"],
          ["fahren (to drive)","fährst","fährt","a → ä"],
          ["schlafen (to sleep)","schläfst","schläft","a → ä"],
          ["sprechen (to speak)","sprichst","spricht","e → i"],
          ["essen (to eat)","isst","isst","e → i"],
          ["lesen (to read)","liest","liest","e → ie"],
          ["sehen (to see)","siehst","sieht","e → ie"]],
   ex:[["Sprichst du Deutsch?","Do you speak German?"],
       ["Er liest ein Buch.","He is reading a book."]],
   tip:"The change never touches <b>ich, wir, ihr, sie</b>. So it is <i>ich spreche</i> but <i>du sprichst</i>."},
  {h:"Two ways to ask a question",
   body:`<p><b>Yes/no question:</b> move the verb to position 1. <span class="de">Du wohnst in Berlin.</span> → <span class="de">Wohnst du in Berlin?</span></p>
   <p><b>W-question:</b> question word first, verb second.</p>`,
   table:[["Word","Meaning","Example"],
          ["wer","who","Wer ist das?"],
          ["was","what","Was machst du?"],
          ["wo","where","Wo wohnst du?"],
          ["woher","where from","Woher kommst du?"],
          ["wann","when","Wann kommt der Bus?"],
          ["wie","how","Wie geht es dir?"],
          ["warum","why","Warum lernst du Deutsch?"]],
   ex:[["Was machst du heute?","What are you doing today?"],
       ["Wohnst du in Hamburg?","Do you live in Hamburg?"]],
   tip:"German never uses a helper like <i>do</i>. <i>Do you play?</i> is simply <b>Spielst du?</b>"}
 ],
 practice:[
  {type:"fill",q:"Du ___ in Berlin.",sub:"You live in Berlin. (wohnen)",a:["wohnst"],ex:"Stem wohn- plus the du ending -st."},
  {type:"mc",q:"Which is correct?",options:["Du sprechst Deutsch.","Du sprichst Deutsch.","Du spreche Deutsch.","Du sprechen Deutsch."],a:1,ex:"sprechen changes e → i in the du and er forms: du sprichst."},
  {type:"fill",q:"Er ___ ein Buch.",sub:"He is reading a book. (lesen)",a:["liest"],ex:"lesen changes e → ie, and the stem already ends in -s, so du and er share the form liest."},
  {type:"order",q:"Build the question: Where do you live? (casual)",words:["Wo","wohnst","du"],a:"Wo wohnst du",ex:"Question word first, verb second, subject third."},
  {type:"mc",q:"How do you say 'I am hungry'?",options:["Ich bin Hunger.","Ich habe Hunger.","Ich bin hungrig haben.","Ich habe hungrig."],a:1,ex:"German uses haben with Hunger, Durst, Angst and Zeit."},
  {type:"listen",say:"Sprichst du Deutsch?",q:"What is being asked?",options:["Do you speak German?","Do you learn German?","Do you understand German?","Are you German?"],a:0,ex:"sprechen = to speak."},
  {type:"fill",q:"Wir ___ Fußball.",sub:"We play football. (spielen)",a:["spielen"],ex:"wir takes the -en ending, identical to the infinitive."},
  {type:"mc",q:"'___ kommt der Bus?' — you want to know the time.",options:["Wo","Wer","Wann","Wie"],a:2,ex:"wann = when. wo = where."}
 ],
 checkpoint:[
  {type:"fill",q:"Ich ___ Zeit.",sub:"I have time.",a:["habe"],ex:"ich habe."},
  {type:"mc",q:"Which sentence asks a yes/no question correctly?",options:["Du kommst aus Spanien?","Kommst du aus Spanien?","Aus Spanien du kommst?","Tust du kommen aus Spanien?"],a:1,ex:"For a yes/no question the verb moves to first position."},
  {type:"fill",q:"Du ___ nach Berlin.",sub:"You are driving to Berlin. (fahren)",a:["fährst","faehrst"],ex:"fahren changes a → ä in du and er: du fährst."},
  {type:"order",q:"Build: What are you doing today? (casual)",words:["Was","machst","du","heute"],a:"Was machst du heute",ex:"W-word, verb, subject, then the rest."},
  {type:"mc",q:"Which form is wrong?",options:["ihr habt","wir haben","er hast","du hast"],a:2,ex:"er hat, not er hast. hast belongs to du."},
  {type:"fill",q:"Ihr ___ Pizza.",sub:"You (plural) eat pizza. (essen)",a:["esst"],ex:"ihr esst — ihr keeps the regular -t ending and no vowel change."}
 ],
 talk:{title:"Talk about your day",task:"Tell your tutor three things you do (wohnen, arbeiten, lernen, spielen, essen…) and ask them two questions using wo, was or wann.",
       starter:"Hallo! Erzähl mir: Was machst du jeden Tag? Und wo wohnst du?"}
},
{
 id:4, title:"Zahlen, Plural, Nein", sub:"Numbers, plural nouns, and saying no",
 goal:"Count, make nouns plural, and negate correctly with nicht or kein.",
 concepts:[
  {h:"Numbers 0 to 20",
   body:`<p>Learn these as a block — they are the base for everything else.</p>`,
   table:[["0-5","6-10","11-15","16-20"],
          ["null, eins, zwei, drei, vier, fünf","sechs, sieben, acht, neun, zehn","elf, zwölf, dreizehn, vierzehn, fünfzehn","sechzehn, siebzehn, achtzehn, neunzehn, zwanzig"]],
   ex:[["Ich habe zwei Brüder.","I have two brothers."],
       ["Das kostet fünfzehn Euro.","That costs fifteen euros."]],
   tip:"<b>sechzehn</b> and <b>siebzehn</b> drop letters — not <i>sechszehn</i> or <i>siebenzehn</i>."},
  {h:"Above 20 the units come first",
   body:`<p>21 is literally <i>one-and-twenty</i>, written as one word.</p>`,
   table:[["Number","German","Literally"],
          ["21","einundzwanzig","one and twenty"],
          ["34","vierunddreißig","four and thirty"],
          ["67","siebenundsechzig","seven and sixty"],
          ["100","hundert",""],
          ["1000","tausend",""]],
   ex:[["Ich bin einunddreißig Jahre alt.","I am thirty-one years old."]],
   tip:"Tens: zwanzig, dreißig (no z!), vierzig, fünfzig, sechzig, siebzig, achtzig, neunzig."},
  {h:"Plural nouns — five patterns",
   body:`<p>There is no single plural -s. The plural article is always <span class="de">die</span>, whatever the singular gender was.</p>`,
   table:[["Pattern","Singular → Plural","Typical for"],
          ["-e (sometimes + umlaut)","der Tisch → die Tische; der Stuhl → die Stühle","many masculine"],
          ["-er (+ umlaut)","das Buch → die Bücher; das Kind → die Kinder","many neuter"],
          ["-n / -en","die Lampe → die Lampen; die Frau → die Frauen","most feminine"],
          ["-s","das Auto → die Autos; das Hotel → die Hotels","loanwords"],
          ["no change (maybe umlaut)","der Lehrer → die Lehrer; der Vater → die Väter","nouns in -er, -en, -el"]],
   ex:[["Die Kinder spielen.","The children are playing."],
       ["Wir haben zwei Autos.","We have two cars."]],
   tip:"Note it down as three pieces: <b>das Buch, die Bücher</b>. Guessing the plural is unreliable."},
  {h:"nicht or kein",
   body:`<p>This is the whole of German negation, and the rule is simple.</p>
   <p><b>kein</b> negates a noun that has <span class="de">ein</span> or no article at all. It behaves exactly like <span class="de">ein</span>, plus it exists in the plural.</p>
   <p><b>nicht</b> negates everything else: verbs, adjectives, adverbs, and nouns with a definite article or possessive.</p>`,
   table:[["Positive","Negative","Why"],
          ["Ich habe ein Auto.","Ich habe kein Auto.","noun with ein"],
          ["Ich trinke Kaffee.","Ich trinke keinen Kaffee.","noun with no article"],
          ["Das ist mein Buch.","Das ist nicht mein Buch.","possessive → nicht"],
          ["Er kommt heute.","Er kommt heute nicht.","verb → nicht, at the end"],
          ["Das ist gut.","Das ist nicht gut.","adjective → nicht goes before it"]],
   ex:[["Ich habe keine Zeit.","I have no time."],
       ["Ich verstehe das nicht.","I do not understand that."]],
   tip:"kein endings: <b>kein</b> Auto (n), <b>keine</b> Zeit (f), <b>kein</b> Haus (n), <b>keine</b> Bücher (pl)."}
 ],
 practice:[
  {type:"mc",q:"How do you write 21?",options:["zwanzigeins","einundzwanzig","zwanzigundein","eins zwanzig"],a:1,ex:"Units first, then und, then the ten — all one word."},
  {type:"fill",q:"Ich habe ___ Zeit.",sub:"I have no time. (Zeit is feminine)",a:["keine"],ex:"kein takes the same endings as ein: keine Zeit."},
  {type:"mc",q:"What is the plural of das Buch?",options:["die Buchen","die Bücher","die Buchs","die Buche"],a:1,ex:"Many neuter nouns form the plural with -er plus an umlaut: die Bücher."},
  {type:"mc",q:"'Das ist ___ mein Auto.' Which word fits?",options:["kein","nicht","keine","nichts"],a:1,ex:"With a possessive (mein) you must use nicht, never kein."},
  {type:"fill",q:"Er kommt heute ___.",sub:"He is not coming today.",a:["nicht"],ex:"nicht negates the verb and lands at the end of a short sentence."},
  {type:"listen",say:"Das kostet fünfzehn Euro.",q:"How much does it cost?",options:["5 euros","15 euros","50 euros","13 euros"],a:1,ex:"fünfzehn = 15. fünfzig = 50 — listen for the -zig ending."},
  {type:"order",q:"Build: I have no car.",words:["Ich","habe","kein","Auto"],a:"Ich habe kein Auto",ex:"das Auto is neuter, so kein has no ending."}
 ],

  {type:"mc",q:"Plural of die Frau?",options:["die Fraus","die Fräue","die Frauen","die Fraun"],a:2,ex:"Most feminine nouns add -n or -en: die Frauen."},
  {type:"mc",q:"'Ich trinke ___ Kaffee.' — I do not drink coffee.",options:["nicht","kein","keinen","keine"],a:2,ex:"Kaffee is masculine and it is the object, so kein takes the accusative ending -en: keinen Kaffee."},

 ],

},
{
 id:5, title:"Der Akkusativ", sub:"The object case and sentence order",
 goal:"Change der to den at the right moment, use object pronouns, and place words in the right order.",
 concepts:[
  {h:"What a case actually does",
   body:`<p>German marks the <i>role</i> of a noun by changing the word in front of it. The subject (the doer) is in the <b>nominative</b>. The direct object (the thing being acted on) is in the <b>accusative</b>.</p>
   <p>The good news: only masculine changes. Feminine, neuter and plural look identical in both cases.</p>`,
   table:[["","Nominative (subject)","Accusative (object)"],
          ["masculine","der / ein","den / einen"],
          ["feminine","die / eine","die / eine"],
          ["neuter","das / ein","das / ein"],
          ["plural","die / keine","die / keine"]],
   ex:[["Der Mann liest das Buch.","The man reads the book."],
       ["Ich sehe den Mann.","I see the man."]],
   tip:"One rule carries 80% of the work: <b>masculine object → den / einen</b>. Everything else stays put."},
  {h:"Object pronouns",
   body:`<p>Pronouns change too — this is the same as English <i>I → me</i>, <i>he → him</i>.</p>`,
   table:[["Nominative","Accusative","English"],
          ["ich","mich","me"],
          ["du","dich","you"],
          ["er","ihn","him / it (masc.)"],
          ["sie","sie","her / them"],
          ["es","es","it"],
          ["wir","uns","us"],
          ["ihr","euch","you (pl.)"],
          ["sie / Sie","sie / Sie","them / you (formal)"]],
   ex:[["Ich liebe dich.","I love you."],
       ["Kennst du ihn?","Do you know him?"]],
   tip:"<b>ihn</b> replaces any masculine noun, not just people: <i>Wo ist der Tisch? — Ich sehe ihn nicht.</i>"},
  {h:"Prepositions that force the accusative",
   body:`<p>After these five, the noun is always accusative — no thinking required.</p>`,
   table:[["Preposition","Meaning","Example"],
          ["für","for","Das ist für den Lehrer."],
          ["ohne","without","Ich trinke Tee ohne Zucker."],
          ["durch","through","Wir gehen durch den Park."],
          ["gegen","against","Wir spielen gegen die Mannschaft."],
          ["um","around / at (time)","Wir sitzen um den Tisch."]],
   ex:[["Ein Geschenk für dich!","A present for you!"],
       ["Ich gehe durch den Wald.","I walk through the forest."]],
   tip:"A memory hook: <b>FOD-GU</b> — für, ohne, durch, gegen, um."},
  {h:"The verb is always in second position",
   body:`<p>In a statement, the conjugated verb sits in slot 2. Slot 1 can be the subject — or a time, a place, or an object you want to emphasise. Whatever you put first, the verb stays second and the subject slides right after it.</p>`,
   table:[["Slot 1","Verb","Rest"],
          ["Ich","lese","heute ein Buch."],
          ["Heute","lese","ich ein Buch."],
          ["Ein Buch","lese","ich heute."]],
   ex:[["Morgen gehe ich ins Kino.","Tomorrow I go to the cinema."],
       ["In Berlin wohnen viele Menschen.","Many people live in Berlin."]],
   tip:"When several details follow, the default order is <b>time — manner — place</b>: <i>Ich fahre morgen mit dem Zug nach Köln.</i>"}
 ],
 practice:[
  {type:"fill",q:"Ich sehe ___ Mann.",sub:"I see the man. (der Mann, and he is the object)",a:["den"],ex:"Masculine direct object: der becomes den."},
  {type:"mc",q:"'Ich habe ___ Hund.' — I have a dog. (der Hund)",options:["ein","einen","eine","einem"],a:1,ex:"Masculine accusative indefinite article is einen."},
  {type:"fill",q:"Kennst du ___?",sub:"Do you know him?",a:["ihn"],ex:"er becomes ihn in the accusative."},
  {type:"mc",q:"'Das Geschenk ist für ___ Lehrer.'",options:["der","den","dem","die"],a:1,ex:"für always takes the accusative, so masculine der becomes den."},
  {type:"order",q:"Build: Tomorrow I am reading a book.",words:["Morgen","lese","ich","ein","Buch"],a:"Morgen lese ich ein Buch",ex:"Time in slot 1, verb in slot 2, subject right after the verb."},
  {type:"listen",say:"Ich liebe dich.",q:"What was said?",options:["I love you.","I know you.","I see you.","I need you."],a:0,ex:"lieben = to love; dich is the accusative of du."},
  {type:"mc",q:"Which sentence keeps the verb in second position?",options:["Heute ich gehe ins Kino.","Heute gehe ich ins Kino.","Ich heute gehe ins Kino.","Gehe heute ich ins Kino."],a:1,ex:"Once Heute occupies slot 1, the verb must come next and the subject follows it."},
  {type:"fill",q:"Wir gehen durch ___ Park.",sub:"We walk through the park. (der Park)",a:["den"],ex:"durch is an accusative preposition."}
 ],
 checkpoint:[
  {type:"fill",q:"Ich kaufe ___ Tisch.",sub:"I am buying a table. (der Tisch)",a:["einen"],ex:"Masculine object with the indefinite article: einen."},
  {type:"mc",q:"Which article does NOT change between nominative and accusative?",options:["der","die","ein (masc.)","kein (masc.)"],a:1,ex:"Feminine die stays die. Only masculine forms change."},
  {type:"order",q:"Build: I see her.",words:["Ich","sehe","sie"],a:"Ich sehe sie",ex:"sie stays sie in the accusative."},
  {type:"mc",q:"'Ich trinke Kaffee ___ Milch.' — without milk.",options:["für","ohne","durch","gegen"],a:1,ex:"ohne = without, and it takes the accusative."},
  {type:"fill",q:"Das ist für ___.",sub:"That is for me.",a:["mich"],ex:"ich becomes mich after für."},
  {type:"mc",q:"Best order for: I am driving to Cologne by train tomorrow.",options:["Ich fahre nach Köln mit dem Zug morgen.","Ich fahre morgen mit dem Zug nach Köln.","Ich morgen fahre nach Köln mit dem Zug.","Ich fahre mit dem Zug morgen nach Köln."],a:1,ex:"Time, then manner, then place: morgen — mit dem Zug — nach Köln."}
 ],
 talk:{title:"Say what you want and see",task:"Tell your tutor what you are buying, eating or seeing today, using at least two masculine nouns so you have to use den or einen.",
       starter:"Hallo! Was kaufst du heute? Sag mir zwei Dinge, zum Beispiel: Ich kaufe einen Tisch."}
},
{
 id:6, title:"Modalverben & trennbare Verben", sub:"Can, must, want — and verbs that split apart",
 goal:"Express ability, obligation and desire, and handle separable verbs that fling a prefix to the end.",
 concepts:[
  {h:"The six modal verbs",
   body:`<p>Modals are irregular in the singular — the vowel changes and the <span class="de">ich</span> and <span class="de">er</span> forms are identical with no ending.</p>`,
   table:[["Verb","Meaning","ich / er","du","wir / sie"],
          ["können","can, to be able","kann","kannst","können"],
          ["müssen","must, to have to","muss","musst","müssen"],
          ["wollen","to want","will","willst","wollen"],
          ["dürfen","to be allowed","darf","darfst","dürfen"],
          ["sollen","should","soll","sollst","sollen"],
          ["mögen / möchten","to like / would like","mag / möchte","magst / möchtest","mögen / möchten"]],
   ex:[["Ich kann schwimmen.","I can swim."],
       ["Ich möchte einen Kaffee, bitte.","I would like a coffee, please."]],
   tip:"Careful: <b>will</b> means <i>wants</i>, not <i>will</i>. <i>Er will gehen</i> = he wants to go."},
  {h:"The second verb goes to the very end",
   body:`<p>A modal takes the conjugated slot, and the main verb drops to the end of the sentence as a plain infinitive. This bracket structure is everywhere in German.</p>`,
   table:[["Slot 1","Modal","Middle","End"],
          ["Ich","kann","gut Deutsch","sprechen."],
          ["Wir","müssen","heute","arbeiten."],
          ["Du","darfst","hier nicht","rauchen."]],
   ex:[["Ich muss morgen früh aufstehen.","I have to get up early tomorrow."],
       ["Kannst du mir helfen?","Can you help me?"]],
   tip:"Say the modal, then hold the main verb in your head until the sentence ends. Practising out loud builds this reflex fastest."},
  {h:"Separable verbs",
   body:`<p>Many verbs are a prefix plus a verb: <span class="de">aufstehen</span> (to get up), <span class="de">anrufen</span> (to call), <span class="de">einkaufen</span> (to shop), <span class="de">fernsehen</span> (to watch TV), <span class="de">mitkommen</span> (to come along).</p>
   <p>In a normal sentence the prefix detaches and jumps to the end.</p>`,
   table:[["Infinitive","In a sentence"],
          ["aufstehen","Ich stehe um sieben Uhr auf."],
          ["anrufen","Ich rufe dich später an."],
          ["einkaufen","Wir kaufen am Samstag ein."],
          ["fernsehen","Er sieht jeden Abend fern."]],
   ex:[["Kommst du mit?","Are you coming along?"],
       ["Ich rufe dich morgen an.","I will call you tomorrow."]],
   tip:"With a modal the verb stays whole at the end: <b>Ich muss früh aufstehen.</b> No splitting."},
  {h:"Telling the time simply",
   body:`<p>For everyday use, <span class="de">um … Uhr</span> plus a number covers most needs.</p>`,

{
 id:7, title:"Der Dativ", sub:"The indirect object and its prepositions",
 goal:"Use dem, der and den + n, the dative pronouns, and the prepositions that always take the dative.",
 concepts:[
  {h:"When to use the dative",
   body:`<p>The dative marks the person or thing that <i>receives</i> something — the indirect object, usually translatable as <i>to</i> or <i>for</i> someone.</p>
   <p><span class="de">Ich gebe <b>dem Kind</b> das Buch.</span> — I give the book <b>to the child</b>. <i>das Buch</i> is the direct object (accusative), <i>dem Kind</i> is the receiver (dative).</p>`,
   table:[["","Nominative","Accusative","Dative"],
          ["masculine","der / ein","den / einen","dem / einem"],
          ["feminine","die / eine","die / eine","der / einer"],
          ["neuter","das / ein","das / ein","dem / einem"],
          ["plural","die","die","den + noun gets -n"]],
   ex:[["Ich gebe dem Mann das Buch.","I give the man the book."],
       ["Ich helfe der Frau.","I help the woman."],
       ["Er spricht mit den Kindern.","He is speaking with the children."]],
   tip:"Feminine <b>die</b> becomes <b>der</b> in the dative. That trips everyone up at first — <i>der Frau</i> here means <i>to the woman</i>."},
  {h:"Dative pronouns",
   body:`<p>Worth memorising as a chant: mir, dir, ihm, ihr, uns, euch, ihnen.</p>`,
   table:[["Nominative","Dative","English"],
          ["ich","mir","to me"],["du","dir","to you"],["er","ihm","to him"],["sie","ihr","to her"],["es","ihm","to it"],
          ["wir","uns","to us"],["ihr","euch","to you (pl.)"],["sie / Sie","ihnen / Ihnen","to them / to you (formal)"]],
   ex:[["Kannst du mir helfen?","Can you help me?"],
       ["Wie geht es dir?","How are you? — literally: how goes it to you?"]],
   tip:"<i>Wie geht es dir / Ihnen?</i> is dative. That is why it is <b>dir</b> and not <i>dich</i>."},
  {h:"Verbs that demand the dative",
   body:`<p>A short list of very common verbs takes a dative object where English would use a plain direct object. Learn them as a set.</p>`,
   table:[["Verb","Meaning","Example"],
          ["helfen","to help","Ich helfe dir."],
          ["danken","to thank","Ich danke Ihnen."],
          ["gehören","to belong to","Das Buch gehört mir."],
          ["gefallen","to please / to like","Berlin gefällt mir."],
          ["antworten","to answer","Antworte mir!"],
          ["passen","to fit / suit","Das passt mir gut."]],
   ex:[["Das Auto gehört meinem Bruder.","The car belongs to my brother."],
       ["Der Film gefällt mir.","I like the film."]],
   tip:"<b>gefallen</b> flips the sentence around: the thing is the subject. <i>Berlin gefällt mir</i> = Berlin pleases me = I like Berlin."},
  {h:"Prepositions that always take the dative",
   body:`<p>After these, the dative is automatic.</p>`,
   table:[["Preposition","Meaning","Example"],
          ["aus","out of, from","Ich komme aus der Schweiz."],
          ["bei","at, near, at someone's place","Ich wohne bei meinen Eltern."],
          ["mit","with, by (transport)","Ich fahre mit dem Bus."],
          ["nach","after, to (cities/countries)","Nach der Arbeit gehe ich nach Hause."],
          ["seit","since, for","Ich lerne seit einem Jahr Deutsch."],
          ["von","from, of","Das ist ein Geschenk von meiner Mutter."],
          ["zu","to (people/places)","Ich gehe zum Arzt."]],
   ex:[["Ich fahre mit dem Zug nach München.","I travel to Munich by train."],
       ["Sie kommt aus der Türkei.","She comes from Turkey."]],
   tip:"Contractions are normal and expected: <b>zu dem → zum</b>, <b>zu der → zur</b>, <b>bei dem → beim</b>, <b>von dem → vom</b>."}
 ],
 practice:[
  {type:"fill",q:"Ich helfe ___ Frau.",sub:"I help the woman. (die Frau — helfen takes the dative)",a:["der"],ex:"Feminine dative: die becomes der."},
  {type:"fill",q:"Kannst du ___ helfen?",sub:"Can you help me?",a:["mir"],ex:"helfen takes the dative, so ich becomes mir, not mich."},

  {type:"listen",say:"Wie geht es dir?",q:"Formal or casual?",options:["Casual","Formal"],a:0,ex:"dir is the casual du form. The formal version is Wie geht es Ihnen?"},

 ],

  {type:"mc",q:"'Ich danke ___.' — I thank you (formal).",options:["Sie","Ihnen","Ihr","Ihren"],a:1,ex:"danken is dative, so the formal Sie becomes Ihnen."},

 ],

{
 id:8, title:"Das Perfekt", sub:"Talking about the past",
 goal:"Build the spoken past tense with haben or sein plus a past participle.",
 concepts:[
  {h:"The past tense Germans actually speak",
   body:`<p>In conversation, Germans use the <b>Perfekt</b> for almost everything that happened — even where English would use a simple past.</p>
   <p>Structure: a helper verb in position 2, and the <b>Partizip II</b> at the very end.</p>`,
   table:[["Slot 1","Helper","Middle","End"],
          ["Ich","habe","gestern Fußball","gespielt."],
          ["Wir","sind","nach Berlin","gefahren."],
          ["Was","hast","du","gemacht?"]],
   ex:[["Ich habe einen Film gesehen.","I watched a film."],
       ["Wir sind ins Kino gegangen.","We went to the cinema."]],
   tip:"Same bracket as modal verbs: helper early, heavy verb at the end."},
  {h:"Building the participle",
   body:`<p>Two families, plus three exceptions worth knowing immediately.</p>`,
   table:[["Type","Recipe","Examples"],
          ["Weak (regular)","ge- + stem + -t","machen → gemacht; spielen → gespielt; lernen → gelernt"],
          ["Strong (irregular)","ge- + changed stem + -en","trinken → getrunken; sehen → gesehen; gehen → gegangen; essen → gegessen"],
          ["Verbs in -ieren","NO ge-, just -t","studieren → studiert; telefonieren → telefoniert"],
          ["Inseparable prefixes (be-, ver-, er-, ent-)","NO ge-","besuchen → besucht; verstehen → verstanden"],
          ["Separable verbs","ge- slots between prefix and verb","aufstehen → aufgestanden; einkaufen → eingekauft"]],
   ex:[["Ich habe Deutsch gelernt.","I studied German."],
       ["Sie hat in Berlin studiert.","She studied in Berlin."],
       ["Ich bin um sieben aufgestanden.","I got up at seven."]],
   tip:"Strong participles must be memorised one by one, exactly like English <i>go → gone</i>, <i>drink → drunk</i>."},
  {h:"haben or sein?",
   body:`<p>Most verbs take <span class="de">haben</span>. Use <span class="de">sein</span> when the verb shows <b>movement from A to B</b> or a <b>change of state</b> — plus the three oddballs <span class="de">sein, bleiben, werden</span>.</p>`,
   table:[["Helper","When","Examples"],
          ["haben","default — almost everything, and anything with a direct object","Ich habe gegessen. Ich habe das Buch gelesen."],
          ["sein","movement to a place","gehen, fahren, fliegen, kommen, laufen: Ich bin nach Hause gegangen."],
          ["sein","change of state","aufstehen, einschlafen, sterben, wachsen: Er ist eingeschlafen."],
          ["sein","the three specials","sein, bleiben, werden: Ich bin in Berlin gewesen."]],
   ex:[["Ich bin nach Italien geflogen.","I flew to Italy."],
       ["Ich habe zu Hause gearbeitet.","I worked at home."]],
   tip:"Quick test: if you could ask <i>where to?</i>, it is probably <b>sein</b>."},
  {h:"war and hatte — the two exceptions",
   body:`<p>For <span class="de">sein</span> and <span class="de">haben</span> themselves, Germans prefer the simple past even when speaking. Say <span class="de">ich war</span>, not <i>ich bin gewesen</i>.</p>`,
   table:[["Pronoun","sein → war","haben → hatte"],
          ["ich","war","hatte"],["du","warst","hattest"],["er/sie/es","war","hatte"],
          ["wir","waren","hatten"],["ihr","wart","hattet"],["sie/Sie","waren","hatten"]],
   ex:[["Ich war gestern krank.","I was ill yesterday."],
       ["Wir hatten keine Zeit.","We had no time."]],
   tip:"The same goes for modals: <i>Ich musste arbeiten</i> (I had to work) beats the Perfekt form."}
 ],
 practice:[
  {type:"fill",q:"Ich ___ Fußball gespielt.",sub:"I played football.",a:["habe"],ex:"spielen is a normal verb with no movement, so it takes haben."},
  {type:"mc",q:"Participle of machen?",options:["machte","gemacht","gemachen","macht"],a:1,ex:"Weak verb: ge- + mach + -t."},
  {type:"mc",q:"'Wir ___ nach Berlin gefahren.'",options:["haben","sind","waren","hatten"],a:1,ex:"fahren is movement from A to B, so it takes sein."},
  {type:"fill",q:"Sie hat in Berlin ___.",sub:"She studied in Berlin. (studieren)",a:["studiert"],ex:"Verbs ending in -ieren never take ge-."},
  {type:"order",q:"Build: I watched a film.",words:["Ich","habe","einen","Film","gesehen"],a:"Ich habe einen Film gesehen",ex:"Helper in slot 2, participle at the very end."},
  {type:"listen",say:"Ich bin um sieben aufgestanden.",q:"What happened?",options:["I get up at seven.","I got up at seven.","I have to get up at seven.","I went to bed at seven."],a:1,ex:"bin + aufgestanden is the Perfekt of aufstehen — a change of state, hence sein."},
  {type:"fill",q:"Ich ___ gestern krank.",sub:"I was ill yesterday. Use the simple past of sein.",a:["war"],ex:"With sein, Germans say ich war rather than ich bin gewesen."},
  {type:"mc",q:"Participle of trinken?",options:["getrinkt","getrunken","trinkte","getrinken"],a:1,ex:"Strong verb: the stem vowel changes and the ending is -en."}
 ],

  {type:"mc",q:"Which sentence is correct?",options:["Ich habe nach Hause gegangen.","Ich bin nach Hause gegangen.","Ich bin nach Hause gehen.","Ich habe nach Hause gehen."],a:1,ex:"gehen is movement to a place: sein + gegangen."},

  {type:"mc",q:"Participle of besuchen (to visit)?",options:["gebesucht","besucht","gebesuchen","besuchte"],a:1,ex:"The inseparable prefix be- blocks ge-."},
  {type:"mc",q:"Which verb takes sein in the Perfekt?",options:["essen","arbeiten","fliegen","lesen"],a:2,ex:"fliegen is movement from one place to another: ich bin geflogen."}
 ],

}

  {h:"The imperative — three forms",

  {h:"Asking for and giving directions",
   body:`<p>Two questions cover almost everything.</p>`,

{
 id:11, level:"A2", title:"Adjektivendungen", sub:"Making adjectives agree",
 goal:"Put the right ending on an adjective in front of a noun.",
 concepts:[
  {h:"The principle: someone has to show the case",
   body:`<p>An adjective after a verb never changes: <span class="de">Das Auto ist neu.</span> Only an adjective <b>before a noun</b> takes an ending.</p>
   <p>The logic: the case and gender must be visible once. If the article already shows it (<span class="de">der, dem, einen</span>), the adjective relaxes into a weak ending. If the article shows nothing, the adjective must do the work.</p>`,
   table:[["Situation","Adjective ending","Example"],["after der/die/das (strong article)","weak: -e or -en","der neue Wagen, den neuen Wagen"],["after ein/kein/mein","mixed: adjective fills the gaps","ein neuer Wagen, mein neues Auto"],["no article at all","strong: adjective copies the article ending","guter Wein, kaltes Wasser"]],
   ex:[["Ich habe ein neues Auto.","I have a new car."],["Der alte Mann liest.","The old man is reading."]],
   tip:"Rule of thumb: after <b>der/die/das</b> the only possible endings are <b>-e</b> and <b>-en</b>. Nothing else."},
  {h:"After the definite article",
   body:`<p>Five slots take <span class="de">-e</span>, everything else takes <span class="de">-en</span>. Memorise the shape, not the table.</p>`,
   table:[["Case","masc.","fem.","neut.","plural"],["Nominative","der gute Wein","die gute Idee","das gute Bier","die guten Ideen"],["Accusative","den guten Wein","die gute Idee","das gute Bier","die guten Ideen"],["Dative","dem guten Wein","der guten Idee","dem guten Bier","den guten Ideen"]],
   ex:[["Ich trinke den guten Wein.","I am drinking the good wine."],["Mit der neuen Kollegin.","With the new colleague."]],
   tip:"The -e corner is small: nominative singular (all three genders) plus feminine and neuter accusative. Everywhere else: -en."},
  {h:"After ein / kein / mein",
   body:`<p><span class="de">ein</span> has no ending in three places — so the adjective supplies it there.</p>`,
   table:[["Case","masc.","fem.","neut.","plural (kein)"],["Nominative","ein guter Wein","eine gute Idee","ein gutes Bier","keine guten Ideen"],["Accusative","einen guten Wein","eine gute Idee","ein gutes Bier","keine guten Ideen"],["Dative","einem guten Wein","einer guten Idee","einem guten Bier","keinen guten Ideen"]],
   ex:[["Das ist ein guter Plan.","That is a good plan."],["Sie hat ein schönes Haus.","She has a beautiful house."]],
   tip:"Compare: <i>der gut<b>e</b> Wein</i> but <i>ein gut<b>er</b> Wein</i>. The -er migrated from the missing article."}
 ],
 practice:[
  {type:"fill",q:"Das ist ein ___ Plan.",sub:"a good plan (gut, masculine nominative after ein)",a:["guter"],ex:"ein shows nothing, so the adjective takes the masculine -er."},
  {type:"mc",q:"'Ich trinke den ___ Wein.'",options:["gute","guter","guten","gutes"],a:2,ex:"Masculine accusative after den: always -en."},
  {type:"fill",q:"Sie hat ein ___ Haus.",sub:"a beautiful house (schön, neuter)",a:["schönes","schoenes"],ex:"ein + neuter: the adjective takes -es."},
  {type:"mc",q:"'Das Auto ist ___.' — the car is new",options:["neues","neue","neu","neuer"],a:2,ex:"After sein/werden/bleiben the adjective never takes an ending."},
  {type:"order",q:"Build: The old man is reading.",words:["Der","alte","Mann","liest"],a:"Der alte Mann liest",ex:"Masculine nominative after der: weak -e."},
  {type:"mc",q:"'Ich spreche mit der ___ Kollegin.'",options:["neue","neuen","neuer","neues"],a:1,ex:"Feminine dative after der: -en."}
 ],
 checkpoint:[
  {type:"fill",q:"Ich möchte einen ___ Kaffee.",sub:"a strong coffee (stark, masculine accusative)",a:["starken"],ex:"einen already shows the case, so the adjective takes the weak -en."},
  {type:"mc",q:"'Das ist ___ Wasser.' — cold water, no article",options:["kalt","kaltes","kalte","kalter"],a:1,ex:"With no article the adjective takes the strong neuter ending -es."},
  {type:"mc",q:"After der/die/das, which endings are possible?",options:["-e and -en only","-er and -es only","all five","none"],a:0,ex:"The definite article does all the signalling, so only -e or -en remain."},
  {type:"fill",q:"Wir haben keine ___ Ideen.",sub:"no good ideas (gut, plural)",a:["guten"],ex:"Plural after kein- is always -en."},
  {type:"order",q:"Build: I have a new car.",words:["Ich","habe","ein","neues","Auto"],a:"Ich habe ein neues Auto",ex:"Neuter accusative after ein looks identical to the nominative."}
 ],
 talk:{title:"Describe things",task:"Describe four things you own using an adjective before the noun. Vary der and ein.",starter:"Hallo! Beschreib mir dein Zimmer: Was für Möbel hast du? Zum Beispiel: ein alter Tisch."}
},
{
 id:12, level:"A2", title:"Das Präteritum", sub:"The written past tense",
 goal:"Read and write narrative past, and know when Germans prefer it over the Perfekt.",
 concepts:[
  {h:"Two past tenses, two jobs",
   body:`<p><b>Perfekt</b> = spoken past, conversation. <b>Präteritum</b> = written past: news, novels, reports. But for <span class="de">sein, haben, werden</span> and the modal verbs, Germans use the Präteritum even when speaking.</p>`,
   table:[["Verb","Präteritum","Use in speech?"],["sein","war","yes, always"],["haben","hatte","yes, always"],["werden","wurde","yes"],["können","konnte","yes"],["müssen","musste","yes"],["gehen","ging","mainly written"]],
   ex:[["Ich war gestern im Kino.","I was at the cinema yesterday."],["Er konnte nicht kommen.","He could not come."]],
   tip:"If you say <i>ich bin gewesen</i> or <i>ich habe gekonnt</i>, it sounds heavy. Use <b>war</b> and <b>konnte</b>."},
  {h:"Weak verbs: stem + te + ending",
   body:`<p>Completely regular. Note that the ich and er forms are identical, as they are for every verb in the Präteritum.</p>`,
   table:[["Pronoun","machen","arbeiten (extra -e-)"],["ich","machte","arbeitete"],["du","machtest","arbeitetest"],["er/sie/es","machte","arbeitete"],["wir","machten","arbeiteten"],["ihr","machtet","arbeitetet"],["sie/Sie","machten","arbeiteten"]],
   ex:[["Sie arbeitete bei einer Bank.","She worked at a bank."],["Wir kauften ein Haus.","We bought a house."]],
   tip:"Stems ending in -t, -d or a consonant cluster insert an -e- for pronounceability: <i>arbeit<b>e</b>te</i>, <i>red<b>e</b>te</i>."},
  {h:"Strong verbs: a new stem vowel, no -te-",
   body:`<p>The ich and er forms have <b>no ending at all</b>. This is the recognisable signature of a strong Präteritum.</p>`,
   table:[["Infinitive","Präteritum (ich/er)","English"],["gehen","ging","went"],["kommen","kam","came"],["sehen","sah","saw"],["fahren","fuhr","drove"],["sprechen","sprach","spoke"],["schreiben","schrieb","wrote"],["finden","fand","found"],["bleiben","blieb","stayed"]],
   ex:[["Er ging nach Hause.","He went home."],["Sie schrieb einen Brief.","She wrote a letter."]],
   tip:"Endings on a strong stem: —, -st, —, -en, -t, -en. So <i>ich ging</i>, <i>du gingst</i>, <i>wir gingen</i>."}
 ],
 practice:[
  {type:"fill",q:"Ich ___ gestern im Kino.",sub:"I was at the cinema yesterday.",a:["war"],ex:"sein → war. Preferred over ich bin gewesen."},
  {type:"mc",q:"Präteritum of gehen (er form)?",options:["gehte","ging","gegangen","gang"],a:1,ex:"Strong verb with no ending in the er form: er ging."},
  {type:"fill",q:"Sie ___ bei einer Bank.",sub:"She worked at a bank. (arbeiten, Präteritum)",a:["arbeitete"],ex:"Weak verb with an inserted -e-: arbeit-e-te."},
  {type:"mc",q:"Which sounds natural in conversation?",options:["Ich habe gekonnt.","Ich konnte.","Ich bin gekonnt.","Ich habe können."],a:1,ex:"Modal verbs use the Präteritum even in speech."},
  {type:"order",q:"Build: She wrote a letter.",words:["Sie","schrieb","einen","Brief"],a:"Sie schrieb einen Brief",ex:"schreiben → schrieb, and Brief is masculine accusative: einen."},
  {type:"mc",q:"Where would you most likely read 'Er kam spät nach Hause'?",options:["In a chat message","In a novel","In a shopping list","In a text to a friend"],a:1,ex:"The Präteritum of ordinary verbs belongs to written narrative."}
 ],
 checkpoint:[
  {type:"fill",q:"Wir ___ keine Zeit.",sub:"We had no time. (haben, Präteritum)",a:["hatten"],ex:"haben → hatte; wir hatten."},
  {type:"mc",q:"Präteritum of sprechen (ich)?",options:["sprechte","sprach","sprochen","sprich"],a:1,ex:"Strong verb: e → a, and no ending."},
  {type:"fill",q:"Er ___ nach Berlin.",sub:"He drove to Berlin. (fahren, Präteritum)",a:["fuhr"],ex:"fahren → fuhr."},
  {type:"mc",q:"Which pair of forms is always identical in the Präteritum?",options:["ich and du","ich and er/sie/es","du and ihr","wir and ihr"],a:1,ex:"ich and er/sie/es share one form for every verb in the Präteritum."},
  {type:"order",q:"Build: We bought a house.",words:["Wir","kauften","ein","Haus"],a:"Wir kauften ein Haus",ex:"Weak verb: kauf + te + n for wir."}
 ],
 talk:{title:"Tell a short story",task:"Tell a small story from your childhood. Use war, hatte and konnte, plus at least two strong Präteritum verbs.",starter:"Hallo! Erzähl mir etwas aus deiner Kindheit. Wo warst du als Kind zu Hause?"}
},
{
 id:13, level:"A2", title:"Nebensätze", sub:"weil, dass, wenn — and the verb at the end",
 goal:"Join two ideas into one sentence and send the verb where it belongs.",
 concepts:[
  {h:"The subordinate clause kicks the verb to the end",
   body:`<p>Certain conjunctions open a subordinate clause, and inside that clause the conjugated verb moves to the final position. A comma always separates the two halves.</p>`,
   table:[["Conjunction","Meaning","Example"],["weil","because","Ich bleibe zu Hause, weil ich krank bin."],["dass","that","Ich weiß, dass du Recht hast."],["wenn","if / whenever","Wenn ich Zeit habe, lese ich."],["ob","whether","Ich frage, ob er kommt."],["obwohl","although","Er arbeitet, obwohl er müde ist."],["damit","so that","Ich lerne, damit ich die Prüfung bestehe."]],
   ex:[["Ich komme nicht, weil ich arbeiten muss.","I am not coming because I have to work."]],
   tip:"With a modal, the modal is the conjugated verb — so the infinitive comes first and the modal goes last: <i>… weil ich arbeiten <b>muss</b>.</i>"},
  {h:"denn and weil are not the same",
   body:`<p><span class="de">denn</span> also means <i>because</i>, but it is a coordinating conjunction: the word order stays completely normal.</p>`,
   table:[["Sentence","Word order"],["Ich bleibe zu Hause, denn ich bin krank.","normal — verb second"],["Ich bleibe zu Hause, weil ich krank bin.","subordinate — verb last"]],
   ex:[["Er kommt nicht, denn er hat keine Zeit.","He is not coming, because he has no time."]],
   tip:"The five that never change word order: <b>und, aber, oder, denn, sondern</b>."},
  {h:"Putting the subordinate clause first",
   body:`<p>If the subordinate clause comes first, the whole clause occupies slot 1 — so the main verb must follow immediately. You get two verbs meeting in the middle.</p>`,
   table:[["Order","Example"],["Main first","Ich lese, wenn ich Zeit habe."],["Sub first","Wenn ich Zeit habe, lese ich."]],
   ex:[["Weil es regnet, bleiben wir zu Hause.","Because it is raining, we are staying home."]],
   tip:"The comma-verb-verb pattern (<i>… habe, lese ich</i>) is the sound of fluent German. Practise it out loud."}
 ],
 practice:[
  {type:"order",q:"Build: I am staying home because I am ill.",words:["Ich","bleibe","zu","Hause,","weil","ich","krank","bin"],a:"Ich bleibe zu Hause, weil ich krank bin",ex:"After weil the verb bin goes to the very end."},
  {type:"mc",q:"Which is correct?",options:["Ich weiß, dass du hast Recht.","Ich weiß, dass du Recht hast.","Ich weiß, dass hast du Recht.","Ich weiß dass du Recht hast."],a:1,ex:"dass sends the verb to the end, and the comma is obligatory."},
  {type:"fill",q:"Ich komme nicht, weil ich arbeiten ___.",sub:"…because I have to work.",a:["muss"],ex:"The modal is the conjugated verb, so it takes the final slot behind the infinitive."},
  {type:"mc",q:"Which conjunction does NOT change the word order?",options:["weil","obwohl","denn","dass"],a:2,ex:"denn is coordinating: verb stays in second position."},
  {type:"order",q:"Build: If I have time, I read.",words:["Wenn","ich","Zeit","habe,","lese","ich"],a:"Wenn ich Zeit habe, lese ich",ex:"The subordinate clause fills slot 1, so the main verb comes straight after the comma."},
  {type:"mc",q:"'Ich frage, ___ er kommt.' — whether he is coming",options:["dass","ob","wenn","weil"],a:1,ex:"ob = whether, for indirect yes/no questions."}
 ],
 checkpoint:[
  {type:"order",q:"Build: He works although he is tired.",words:["Er","arbeitet,","obwohl","er","müde","ist"],a:"Er arbeitet, obwohl er müde ist",ex:"obwohl is subordinating: ist goes last."},
  {type:"mc",q:"'Er kommt nicht, denn er ___ keine Zeit.'",options:["hat","hatte haben","haben","habe"],a:0,ex:"After denn the order is normal, so the verb stays in second position: er hat."},
  {type:"fill",q:"Ich lerne, damit ich die Prüfung ___.",sub:"…so that I pass the exam. (bestehen)",a:["bestehe"],ex:"damit is subordinating, so the verb lands at the end: bestehe."},
  {type:"mc",q:"What goes immediately after a fronted subordinate clause?",options:["the subject","the conjugated verb of the main clause","a second conjunction","nothing"],a:1,ex:"The clause occupies slot 1, so slot 2 must hold the main verb."},
  {type:"order",q:"Build: Because it is raining, we are staying at home.",words:["Weil","es","regnet,","bleiben","wir","zu","Hause"],a:"Weil es regnet, bleiben wir zu Hause",ex:"Verb-final in the weil clause, then verb-first in the main clause."}
 ],
 talk:{title:"Give reasons",task:"Say three things about your life and justify each with weil. Then use one obwohl sentence.",starter:"Hallo! Warum lernst du eigentlich Deutsch? Antworte bitte mit weil."}
},
{
 id:14, level:"A2", title:"Wechselpräpositionen", sub:"Two-way prepositions: wo or wohin",
 goal:"Decide between accusative and dative after the nine flexible prepositions.",
 concepts:[
  {h:"The nine two-way prepositions",
   body:`<p>These take the <b>accusative</b> when there is movement into a new place (answer to <span class="de">wohin?</span>) and the <b>dative</b> when describing a static position (answer to <span class="de">wo?</span>).</p>`,
   table:[["Preposition","Meaning","wohin? (acc.)","wo? (dat.)"],["in","in / into","Ich gehe in die Küche.","Ich bin in der Küche."],["auf","on (top of)","Ich lege das Buch auf den Tisch.","Das Buch liegt auf dem Tisch."],["an","at / onto","Ich hänge das Bild an die Wand.","Das Bild hängt an der Wand."],["unter / über","under / above","Die Katze läuft unter das Bett.","Die Katze schläft unter dem Bett."],["vor / hinter","in front of / behind","Er stellt sich vor die Tür.","Er steht vor der Tür."],["neben / zwischen","next to / between","Setz dich neben mich!","Er sitzt neben mir."]],
   ex:[["Ich gehe ins Kino.","I am going to the cinema."],["Ich bin im Kino.","I am at the cinema."]],
   tip:"Contractions: <b>in das → ins</b>, <b>in dem → im</b>, <b>an das → ans</b>, <b>an dem → am</b>, <b>auf das → aufs</b>."},
  {h:"The verb usually gives the answer",
   body:`<p>German has pairs of verbs: one for putting (movement, accusative) and one for being (position, dative).</p>`,
   table:[["Movement (acc.)","Position (dat.)","Meaning"],["legen (legt, legte, gelegt)","liegen (liegt, lag, gelegen)","lay down / lie"],["stellen","stehen (steht, stand, gestanden)","stand up / stand"],["setzen","sitzen (sitzt, saß, gesessen)","set down / sit"],["hängen (weak)","hängen (hing, gehangen)","hang up / be hanging"]],
   ex:[["Ich stelle die Flasche auf den Tisch.","I put the bottle on the table."],["Die Flasche steht auf dem Tisch.","The bottle is standing on the table."]],
   tip:"If the verb has a direct object and a -t participle (<i>gelegt, gestellt</i>), it is a movement verb — use the accusative."},
  {h:"Talking about place names",
   body:`<p>Where you go uses a different word depending on the type of destination.</p>`,
   table:[["Destination","Word","Example"],["cities, countries without article","nach","Ich fahre nach Berlin / nach Italien."],["home","nach Hause","Ich gehe nach Hause."],["people, institutions","zu","Ich gehe zum Arzt."],["enclosed places you enter","in + acc.","Ich gehe in die Schule."],["countries with article","in + acc.","Ich fliege in die Türkei."]],
   ex:[["Ich bin zu Hause.","I am at home."],["Ich gehe nach Hause.","I am going home."]],
   tip:"<b>nach Hause</b> = going home, <b>zu Hause</b> = being at home. A single letter, two meanings."}
 ],
 practice:[
  {type:"mc",q:"'Das Buch liegt auf ___ Tisch.'",options:["den","dem","der","das"],a:1,ex:"liegen describes position, so dative: auf dem Tisch."},
  {type:"fill",q:"Ich lege das Buch auf ___ Tisch.",sub:"I lay the book onto the table.",a:["den"],ex:"legen is movement: accusative den Tisch."},
  {type:"mc",q:"'Ich gehe ___ Kino.' — contraction of in das",options:["im","ins","ans","zum"],a:1,ex:"Movement into: in + accusative das → ins."},
  {type:"mc",q:"Which question does the dative answer?",options:["wohin?","wo?","woher?","wann?"],a:1,ex:"wo = static position → dative. wohin = movement → accusative."},
  {type:"fill",q:"Ich fahre ___ Berlin.",sub:"I am travelling to Berlin.",a:["nach"],ex:"Cities take nach."},
  {type:"order",q:"Build: The cat is sleeping under the bed.",words:["Die","Katze","schläft","unter","dem","Bett"],a:"Die Katze schläft unter dem Bett",ex:"schlafen is static, so dative."}
 ],
 checkpoint:[
  {type:"fill",q:"Das Bild hängt an ___ Wand.",sub:"The picture hangs on the wall. (die Wand)",a:["der"],ex:"Position → dative; feminine dative is der."},
  {type:"mc",q:"'Ich hänge das Bild an ___ Wand.'",options:["der","die","dem","den"],a:1,ex:"hängen with an object is movement: accusative die Wand."},
  {type:"mc",q:"'Ich bin ___ Hause.' — I am at home.",options:["nach","zu","in","an"],a:1,ex:"zu Hause = at home; nach Hause = going home."},
  {type:"fill",q:"Ich gehe ___ Arzt.",sub:"I am going to the doctor. (zu + dem contracted)",a:["zum"],ex:"People and institutions take zu, which contracts to zum."},
  {type:"mc",q:"Which verb signals the accusative?",options:["stehen","liegen","stellen","sitzen"],a:2,ex:"stellen means to place something — movement, therefore accusative."}
 ],
 talk:{title:"Where is everything?",task:"Describe where five things are in your room, then say where you are putting two of them.",starter:"Hallo! Beschreib mir dein Zimmer. Wo steht dein Bett, und was liegt auf deinem Tisch?"}

{
 id:15, level:"A2", title:"Vergleiche", sub:"Comparative and superlative",
 goal:"Compare two things and pick the best one, including the irregulars.",
 concepts:[
  {h:"Building the forms",
   body:`<p>Comparative: add <span class="de">-er</span>. Superlative: add <span class="de">-st</span> and use <span class="de">am …sten</span> when the adjective stands alone.</p>`,
   table:[["Adjective","Comparative","Superlative"],["schnell","schneller","am schnellsten"],["schön","schöner","am schönsten"],["alt","älter","am ältesten"],["groß","größer","am größten"],["jung","jünger","am jüngsten"],["interessant","interessanter","am interessantesten"]],
   ex:[["Mein Bruder ist älter als ich.","My brother is older than I am."],["Der Zug ist am schnellsten.","The train is the fastest."]],
   tip:"Short one-syllable adjectives with a, o, u usually add an umlaut: alt → älter, groß → größer, jung → jünger."},
  {h:"als and wie",
   body:`<p>These two are the classic mistake.</p>`,
   table:[["Structure","Meaning","Example"],["…er als","-er than","Berlin ist größer als München."],["so … wie","as … as","Berlin ist so teuer wie Hamburg."],["nicht so … wie","not as … as","Es ist nicht so kalt wie gestern."]],
   ex:[["Sie spricht besser als ich.","She speaks better than I do."]],
   tip:"<b>als</b> after a comparative, <b>wie</b> after <i>so</i>. Never <i>größer wie</i>, though you will hear natives say it."},
  {h:"Irregular forms and attributive use",
   body:`<p>Four irregulars appear constantly. And in front of a noun, the superlative takes normal adjective endings instead of <span class="de">am …sten</span>.</p>`,
   table:[["Positive","Comparative","Superlative"],["gut","besser","am besten / der beste"],["viel","mehr","am meisten / die meisten"],["gern","lieber","am liebsten"],["hoch","höher","am höchsten"],["nah","näher","am nächsten"]],
   ex:[["Das ist der beste Film des Jahres.","That is the best film of the year."],["Ich trinke lieber Tee.","I prefer to drink tea."]],
   tip:"<b>gern – lieber – am liebsten</b> is how German says <i>like – prefer – like most</i>: <i>Ich esse gern Pizza, aber lieber Pasta.</i>"}
 ],
 practice:[
  {type:"fill",q:"Mein Bruder ist ___ als ich.",sub:"older than me (alt)",a:["älter","aelter"],ex:"Short adjectives add an umlaut in the comparative: älter."},
  {type:"mc",q:"'Berlin ist größer ___ München.'",options:["wie","als","so","denn"],a:1,ex:"als follows a comparative."},
  {type:"fill",q:"Der Zug ist am ___.",sub:"the fastest (schnell)",a:["schnellsten"],ex:"am + adjective + sten for a standalone superlative."},
  {type:"mc",q:"Comparative of gut?",options:["guter","gutter","besser","mehr"],a:2,ex:"gut – besser – am besten, an irregular like English good – better."},
  {type:"order",q:"Build: I prefer to drink tea.",words:["Ich","trinke","lieber","Tee"],a:"Ich trinke lieber Tee",ex:"lieber is the comparative of gern and sits before the object."},
  {type:"mc",q:"'Es ist nicht so kalt ___ gestern.'",options:["als","wie","dass","denn"],a:1,ex:"so … wie for equality, including the negative version."}
 ],
 checkpoint:[
  {type:"fill",q:"Das ist der ___ Film des Jahres.",sub:"the best film (gut, superlative before a noun)",a:["beste"],ex:"Before a noun the superlative takes a normal weak ending: der beste Film."},
  {type:"mc",q:"Superlative of viel?",options:["am vielsten","am mehrsten","am meisten","am vieler"],a:2,ex:"viel – mehr – am meisten."},
  {type:"fill",q:"Sie spricht ___ als ich.",sub:"better than me",a:["besser"],ex:"gut → besser."},
  {type:"mc",q:"Which sentence is standard German?",options:["Er ist größer wie ich.","Er ist größer als ich.","Er ist so größer wie ich.","Er ist mehr groß als ich."],a:1,ex:"Comparative plus als. The wie version is common in speech but non-standard."},
  {type:"order",q:"Build: Berlin is as expensive as Hamburg.",words:["Berlin","ist","so","teuer","wie","Hamburg"],a:"Berlin ist so teuer wie Hamburg",ex:"so … wie brackets the adjective."}
 ],
 talk:{title:"Compare your world",task:"Compare two cities, two foods and two languages. Use als, so…wie and one superlative.",starter:"Hallo! Vergleich mal: Welche Stadt gefällt dir besser und warum?"}
},
{
 id:16, level:"A2", title:"Reflexive Verben", sub:"Doing things to yourself",
 goal:"Use sich correctly, including the dative version, and spot verbs that are reflexive only in German.",
 concepts:[
  {h:"The reflexive pronouns",
   body:`<p>Accusative reflexives look like the normal object pronouns except in the third person, where everything becomes <span class="de">sich</span>.</p>`,
   table:[["Person","Accusative","Dative"],["ich","mich","mir"],["du","dich","dir"],["er/sie/es","sich","sich"],["wir","uns","uns"],["ihr","euch","euch"],["sie/Sie","sich","sich"]],
   ex:[["Ich wasche mich.","I wash (myself)."],["Wir freuen uns.","We are pleased."]],
   tip:"Only <b>ich</b> and <b>du</b> distinguish mich/mir and dich/dir. Everywhere else the two columns are identical."},
  {h:"Common reflexive verbs",
   body:`<p>Many German verbs are reflexive where English uses none at all. Learn them as a block with <span class="de">sich</span>.</p>`,
   table:[["Verb","Meaning","Example"],["sich freuen (über/auf)","to be glad / look forward","Ich freue mich auf den Urlaub."],["sich interessieren für","to be interested in","Er interessiert sich für Musik."],["sich erinnern an","to remember","Erinnerst du dich an mich?"],["sich beeilen","to hurry","Beeil dich!"],["sich entschuldigen","to apologise","Ich entschuldige mich."],["sich fühlen","to feel","Ich fühle mich gut."]],
   ex:[["Ich freue mich auf das Wochenende.","I am looking forward to the weekend."]],
   tip:"<b>sich freuen auf</b> = look forward to (future); <b>sich freuen über</b> = be glad about (present or past)."},
  {h:"Dative reflexive: when there is another object",
   body:`<p>If the sentence already has a direct object, the reflexive pronoun switches to the dative — the body part or thing is the object, and you are the beneficiary.</p>`,
   table:[["Sentence","Reflexive","Why"],["Ich wasche mich.","accusative","no other object"],["Ich wasche mir die Hände.","dative","die Hände is the direct object"],["Ich kaufe mir ein Auto.","dative","ein Auto is the object"],["Kannst du dir das vorstellen?","dative","das is the object"]],
   ex:[["Ich putze mir die Zähne.","I brush my teeth."],["Stell dir vor!","Just imagine!"]],
   tip:"German says <i>ich putze <b>mir</b> die Zähne</i>, not <i>meine Zähne</i> — the dative already shows whose they are."}
 ],

{
 id:17, level:"A2", title:"Zukunft und Verbindungen", sub:"Futur I and linking your sentences",
 goal:"Talk about the future and connect ideas like an intermediate speaker.",
 concepts:[
  {h:"The present tense is usually the future",
   body:`<p>With a time expression, German uses the present for future events. <span class="de">Futur I</span> (werden + infinitive) is reserved for predictions, promises and emphasis.</p>`,
   table:[["Form","Example","Feel"],["Present + time word","Morgen fahre ich nach Wien.","normal, everyday"],["Futur I","Ich werde dich nie vergessen.","promise, prediction, emphasis"],["Futur I + wohl","Er wird wohl krank sein.","assumption: he is probably ill"]],
   ex:[["Nächste Woche beginne ich einen Kurs.","Next week I am starting a course."],["Es wird morgen regnen.","It will rain tomorrow."]],
   tip:"Overusing <i>werden</i> is a classic learner tell. If there is a <i>morgen</i> or <i>nächstes Jahr</i>, just use the present."},
  {h:"werden — three different jobs",
   body:`<p>Same verb, three functions. Context decides.</p>`,
   table:[["Use","Structure","Example"],["future","werden + infinitive","Ich werde anrufen."],["to become","werden + noun/adjective","Er wird Arzt. Es wird kalt."],["passive","werden + Partizip II","Das Haus wird gebaut."]],
   ex:[["Ich werde Lehrerin.","I am going to become a teacher."],["Es wird dunkel.","It is getting dark."]],
   tip:"Conjugation: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden."},
  {h:"Linking words that change word order",
   body:`<p>Three groups, three behaviours. This is where intermediate German is won or lost.</p>`,
   table:[["Group","Words","Effect"],["Coordinating","und, aber, oder, denn, sondern","nothing changes"],["Adverbial","deshalb, trotzdem, dann, außerdem, sonst","they occupy slot 1, so verb comes next"],["Subordinating","weil, obwohl, dass, wenn, damit, ob","verb goes to the end"]],
   ex:[["Ich bin müde, deshalb gehe ich ins Bett.","I am tired, so I am going to bed."],["Er lernt viel, trotzdem ist die Prüfung schwer.","He studies a lot; nevertheless the exam is hard."]],
   tip:"<b>sondern</b> only follows a negative: <i>Das ist nicht mein Buch, sondern deins.</i>"}
 ],

  {type:"fill",q:"Ich ___ dich nie vergessen.",sub:"I will never forget you. (Futur I)",a:["werde"],ex:"ich werde + infinitive at the end."},
